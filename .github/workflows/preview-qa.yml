name: Preview QA
on:
  push:
    branches:
      - preview/clean-v1
  pull_request:
    branches:
      - main
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: npm run check
      - name: Static build/content smoke
        run: npm run build:check
      - name: Diagnostic/content regression
        run: npm run test:diagnostic
      - name: Content bundle readiness regression
        run: npm run test:content
      - name: Guide/learning regression
        run: npm run test:guide
      - name: Release/no-secrets regression
        run: npm run test:release
      - run: npm install --no-save @playwright/test@1.63.0
      - run: npx playwright install --with-deps chromium
      - name: Browser desktop/mobile regression
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: otto-b1-diagnostic-v2-qa
          path: test-results/**/*
          if-no-files-found: warn
