<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#dfeeff">
  <meta name="description" content="Тренажёр Otto — подготовка к Goethe-Zertifikat B1">
  <title>Тренажёр Otto — B1 Beta</title>
  <style>:root{
  --ink:#11263d;--muted:#68798b;--line:#e2e9f0;--blue:#2767d7;--navy:#143a67;
  --soft:#f5f8fc;--soft2:#eef5ff;--good:#176c4a;--goodbg:#eef8f3;
  --warn:#8a5b0a;--warnbg:#fff8e8;--bad:#993b38;--badbg:#fff2f1;
  --shadow:0 18px 55px rgba(18,42,68,.10);
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff;color:var(--ink)}
button,input,textarea,select{font:inherit}.hidden{display:none!important}
.app-shell{max-width:1120px;min-height:100vh;margin:0 auto;background:#fff;position:relative}
.topbar{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.96);backdrop-filter:blur(14px);position:sticky;top:0;z-index:20}
.brand{border:0;background:none;display:flex;align-items:baseline;gap:10px;color:var(--ink);cursor:pointer}
.brand-mark{font-family:Georgia,serif;font-size:25px;font-weight:800;letter-spacing:-.5px;border-bottom:3px solid var(--blue);line-height:1.05}
.brand-level{font-size:10px;font-weight:850;letter-spacing:.09em;color:var(--muted);text-transform:uppercase}
.icon-btn{width:40px;height:40px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);font-weight:900;cursor:pointer}
.screen{padding:38px 36px 130px;min-height:calc(100vh - 70px)}
.h1{font-family:Georgia,serif;font-size:clamp(38px,5vw,60px);line-height:1.04;letter-spacing:-.03em;margin:0 0 16px}
.h2{font-family:Georgia,serif;font-size:clamp(29px,4vw,43px);line-height:1.08;letter-spacing:-.02em;margin:0 0 12px}
.lead{font-size:18px;line-height:1.65;color:var(--muted);max-width:760px}
.eyebrow,.kicker{display:block;font-size:11px;font-weight:900;letter-spacing:.11em;text-transform:uppercase;color:var(--blue);margin-bottom:9px}
.muted{color:var(--muted);line-height:1.58}.small{font-size:12px;color:var(--muted);line-height:1.45}
.btn{border:0;border-radius:15px;padding:14px 18px;font-weight:850;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s transform,.15s box-shadow}
.btn:hover{transform:translateY(-1px)}.btn.primary{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;box-shadow:0 10px 24px rgba(39,103,215,.22)}
.btn.secondary{background:var(--soft2);color:var(--navy);border:1px solid #dae7f7}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.button-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 8px 28px rgba(17,38,61,.035)}
.card.soft{background:linear-gradient(145deg,#fbfdff,#f3f7fc)}.card.good{background:var(--goodbg);border-color:#d7ede2}.card.warn{background:var(--warnbg);border-color:#f0e1b8}.card.bad{background:var(--badbg);border-color:#efd5d3}
.card-title{font-weight:900;margin-bottom:6px}.stack{display:grid;gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.field{width:100%;border:1px solid #ced9e5;background:#fff;border-radius:15px;padding:14px 15px;color:var(--ink);outline:none}.field:focus{border-color:#79a5e8;box-shadow:0 0 0 4px rgba(39,103,215,.10)}
textarea.field{resize:vertical;line-height:1.55}.form-grid{display:grid;gap:16px}
.registration-stage{margin:-38px -36px -130px;padding:48px 36px 150px;min-height:calc(100vh - 70px);background:linear-gradient(145deg,#eaf4ff 0%,#dcecff 48%,#edf6ff 100%)}
.auth-wrap{max-width:820px;margin:0 auto}.auth-hero{text-align:center;margin-bottom:25px}.auth-otto{width:260px;height:230px;margin:0 auto 10px;background:transparent;border:0;border-radius:0;overflow:visible;display:grid;place-items:center}
.auth-otto.natural img{width:100%;height:100%;object-fit:contain;object-position:50% 50%;transform:none}.auth-card{border:1px solid rgba(158,183,211,.58);border-radius:28px;padding:28px;background:rgba(255,255,255,.96);box-shadow:0 20px 58px rgba(25,67,108,.12)}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;background:#f3f6f9;padding:5px;border-radius:15px}.auth-tabs button{border:0;background:transparent;border-radius:11px;padding:11px;font-weight:850;color:var(--muted);cursor:pointer}
.auth-tabs button.active{background:#fff;color:var(--ink);box-shadow:0 3px 12px rgba(17,38,61,.08)}
.friendly-note{border-radius:20px;padding:16px 18px;background:#f5f8fd;border:1px solid #e0eaf6;line-height:1.6;color:#455e77}
.gate-card{max-width:780px;margin:66px auto;padding:34px;border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow);text-align:center}
.registration-note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:12px}.verify-code{font-size:25px;letter-spacing:.18em;text-align:center;font-weight:900}.diagnostic-meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:-10px 0 20px;color:var(--muted);font-size:12px;font-weight:750}.audio-card{border:1px solid #cdddef;background:#f4f9ff;border-radius:20px;padding:17px;margin:16px 0}.diagnostic-profile{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.profile-band{font-family:Georgia,serif;font-size:24px;font-weight:800;margin:10px 0}.route-card{display:grid;grid-template-columns:72px 1fr;gap:16px;align-items:start;border:1px solid var(--line);border-radius:22px;padding:18px;background:#fff}.route-weight{width:58px;height:58px;border-radius:18px;background:#eaf3ff;display:grid;place-items:center;color:var(--navy);font-weight:900}.route-card p{margin:5px 0 0;color:var(--muted);line-height:1.5}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.progress-line{height:8px;background:#edf1f5;border-radius:999px;overflow:hidden;margin:12px 0 22px}.progress-line i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--blue));border-radius:999px}
.choice-grid{display:grid;gap:10px;margin:18px 0}.choice{width:100%;text-align:left;border:1px solid #d7e0e9;background:#fff;border-radius:16px;padding:14px 15px;cursor:pointer;color:var(--ink);font-weight:700}
.choice:hover{border-color:#9db9dc;background:#fafcff}.choice.selected{border-color:var(--blue);background:#eff5ff;box-shadow:0 0 0 2px rgba(39,103,215,.07)}
.task-text{font-size:17px;line-height:1.72;background:#fafbfd;border:1px solid var(--line);border-radius:20px;padding:20px;margin:16px 0}.task-tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{border:1px solid #d8e1eb;background:#fff;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:850;color:#3b5d7c;cursor:pointer}
.notice{border-left:4px solid var(--blue);background:#f5f8fc;border-radius:0 16px 16px 0;padding:14px 16px;color:#466079;line-height:1.55;margin:14px 0}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:900;background:#eff3f7;color:#4a6177}.pill.good{background:var(--goodbg);color:var(--good)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}
.mode-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin:22px 0}.mode-card{border:1px solid var(--line);border-radius:26px;padding:24px;background:#fff}.mode-card.primary-mode{background:linear-gradient(145deg,#f9fcff,#edf5ff);border-color:#dbe8f8}
.mode-card h3{font-family:Georgia,serif;font-size:25px;margin:8px 0}.mode-icon{font-size:29px}
.modules-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.module-pick{border:1px solid var(--line);background:#fff;border-radius:22px;padding:20px;text-align:left;cursor:pointer;transition:.15s transform,.15s box-shadow,.15s border-color}
.module-pick:hover{transform:translateY(-2px);border-color:#b9cbe0;box-shadow:0 12px 28px rgba(18,44,70,.07)}.module-name{font-family:Georgia,serif;font-size:22px;font-weight:800;margin:8px 0 4px}.module-count{font-size:12px;color:var(--muted)}
.module-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:20px}.module-meta{display:flex;gap:8px;flex-wrap:wrap}.meta-chip{border:1px solid var(--line);background:#f8fafc;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800;color:#52677c}
.exam-map{display:grid;gap:11px;margin-top:18px}.teil-row{display:grid;grid-template-columns:86px 1fr auto;gap:16px;align-items:center;border:1px solid var(--line);border-radius:18px;padding:16px;background:#fff}.teil-num{font-weight:900;color:var(--navy)}.teil-row p{margin:4px 0 0;color:var(--muted);line-height:1.5;font-size:13px}
.exam-banner{background:#102b48;color:#fff;border-radius:26px;padding:25px}.exam-banner .muted{color:#c8d6e4}
.speaker{display:flex;align-items:center;gap:12px;background:#f8fafc;border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}.speaker-avatar{width:50px;height:50px;border-radius:50%;overflow:hidden;background:#fff;flex:0 0 auto}.speaker-avatar img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.bubble{background:#eff5ff;border-radius:18px 18px 18px 4px;padding:14px 16px;line-height:1.55}.bubble.user{margin-left:13%;background:#143a67;color:#fff;border-radius:18px 18px 4px 18px}
.record-box{border:1px dashed #a9bacb;border-radius:18px;padding:16px;text-align:center}.record-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#aeb8c2;margin-right:7px}.recording .record-dot{background:#d5443f;box-shadow:0 0 0 6px rgba(213,68,63,.12)}
.bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(1120px,100%);height:76px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;justify-content:center;gap:6px;z-index:18;backdrop-filter:blur(15px);padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav button{flex:1;max-width:180px;border:0;background:none;color:#708195;display:grid;place-items:center;align-content:center;gap:3px;cursor:pointer}.bottom-nav button span{font-size:20px}.bottom-nav button small{font-size:11px;font-weight:800}.bottom-nav button.active{color:var(--blue)}
.otto-fab{position:fixed;right:max(16px,calc((100vw - 1120px)/2 + 18px));bottom:92px;border:0;background:#102f52;color:#fff;border-radius:999px;padding:7px 14px 7px 7px;box-shadow:0 12px 28px rgba(10,47,89,.24);display:flex;align-items:center;gap:8px;font-weight:850;z-index:19;cursor:pointer}.otto-fab img{width:42px;height:42px;border-radius:50%;object-fit:cover;object-position:50% 13%;background:#fff}
.modal-backdrop{position:fixed;inset:0;background:rgba(7,20,34,.48);z-index:50;display:grid;place-items:center;padding:18px}.modal{width:min(650px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:26px;border:1px solid var(--line);box-shadow:var(--shadow);padding:24px}.modal-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:14px}.close{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:12px;cursor:pointer}
@media(max-width:850px){.modules-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.mode-grid,.grid2{grid-template-columns:1fr}.diagnostic-profile{grid-template-columns:repeat(2,minmax(0,1fr))}.teil-row{grid-template-columns:70px 1fr}.teil-row .btn{grid-column:2}.module-head{display:grid}}
@media(max-width:720px){.screen{padding:26px 18px 126px}.registration-stage{margin:-26px -18px -126px;padding:34px 18px 145px}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.topbar{padding:0 15px}.brand-level{display:none}.otto-fab span{display:none}.otto-fab{padding:6px;right:14px}.auth-card{padding:22px}.gate-card{margin-top:24px;padding:24px}}
@media(max-width:430px){.screen{padding-left:14px;padding-right:14px}.registration-stage{margin-left:-14px;margin-right:-14px;padding-left:14px;padding-right:14px}.modules-grid,.grid4{grid-template-columns:1fr 1fr}.diagnostic-profile{grid-template-columns:1fr}.button-row .btn{width:100%}.teil-row{grid-template-columns:1fr}.teil-row .btn{grid-column:1}.auth-otto{width:230px;height:205px}.route-card{grid-template-columns:58px 1fr}.route-weight{width:50px;height:50px;border-radius:15px}}

.first-onboarding{margin:-38px -36px -130px;padding:52px 44px 150px;min-height:calc(100vh - 70px);background:linear-gradient(145deg,#e7f2ff 0%,#d8eaff 52%,#edf6ff 100%);display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:42px;align-items:center}
.first-copy{max-width:690px}.first-copy .lead{color:#496781}.first-otto{align-self:stretch;display:flex;align-items:flex-end;justify-content:center;overflow:visible;min-height:610px}
.first-otto img{width:min(460px,100%);height:auto;max-height:610px;object-fit:contain;object-position:center bottom;display:block;filter:drop-shadow(0 24px 28px rgba(42,83,122,.12))}
.plain-otto{width:180px;height:190px;margin:0 auto 10px;display:flex;align-items:flex-end;justify-content:center;overflow:visible}.plain-otto img{max-width:190px;max-height:190px;object-fit:contain;object-position:center bottom}
.diag-top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.time-left{flex:0 0 auto;background:#eef5ff;border:1px solid #d9e7f7;color:var(--navy);font-weight:900;border-radius:999px;padding:9px 13px}.meta-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}
.audio-card{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border:1px solid #cdddef;background:#f4f9ff;border-radius:20px;padding:17px;margin:16px 0}.audio-card .small{margin-left:auto}
@media(max-width:850px){.first-onboarding{grid-template-columns:1fr;padding-top:36px}.first-otto{min-height:420px;order:-1}.first-otto img{max-height:420px;width:min(330px,80vw)}}
@media(max-width:720px){.first-onboarding{margin:-26px -18px -126px;padding:28px 18px 142px}.first-otto{min-height:330px}.first-otto img{max-height:330px;width:min(290px,82vw)}.diag-top{display:grid}.time-left{justify-self:start}}
@media(max-width:430px){.first-onboarding{margin-left:-14px;margin-right:-14px;padding-left:14px;padding-right:14px}.first-otto{min-height:285px}.first-otto img{max-height:285px;width:min(250px,82vw)}}


/* ===== Owner UX block: unified blue product canvas ===== */
html,body{
  background:
    radial-gradient(circle at 12% 8%,rgba(255,255,255,.62),transparent 31%),
    radial-gradient(circle at 88% 18%,rgba(164,203,244,.30),transparent 28%),
    linear-gradient(145deg,#e8f3ff 0%,#dcecff 50%,#eef7ff 100%);
  background-attachment:fixed;
}
.app-shell{background:transparent}
.topbar{background:rgba(225,240,255,.88);border-bottom-color:rgba(141,174,207,.45);box-shadow:0 8px 30px rgba(61,101,140,.06)}
.screen{background:transparent}
.card,.mode-card,.module-pick,.teil-row,.task-text,.audio-card,.speaker,.record-box,.auth-card,.gate-card{
  background:rgba(247,251,255,.82);
  border-color:rgba(160,188,216,.62);
  box-shadow:0 10px 30px rgba(38,78,117,.055);
}
.card.soft,.mode-card.primary-mode{background:linear-gradient(145deg,rgba(248,252,255,.92),rgba(231,243,255,.90))}
.btn.ghost,.chip,.icon-btn,.close{background:rgba(245,250,255,.86);border-color:rgba(150,181,211,.58)}
.field{background:rgba(250,253,255,.9);border-color:rgba(145,177,210,.65)}
.choice{background:rgba(249,252,255,.9);border-color:rgba(157,185,214,.62)}
.choice:hover{background:#f1f7ff}
.notice{background:rgba(239,247,255,.9)}
.bottom-nav{

}
.bottom-nav button{max-width:170px;color:#5f7890;min-width:0}
.bottom-nav button span{font-size:19px}
.bottom-nav button small{font-size:10px}
.bottom-nav .otto-nav{transform:translateY(-13px);color:var(--navy);overflow:visible}
.otto-nav-face{width:54px;height:54px;border-radius:50%;display:grid!important;place-items:center;background:linear-gradient(145deg,#1d568f,#2d78c7);border:4px solid #e5f2ff;box-shadow:0 8px 22px rgba(20,68,112,.23);overflow:hidden}
.otto-nav-face img{width:130%;height:130%;object-fit:contain;object-position:50% 6%;transform:translateY(5px)}
.otto-nav small{font-weight:900!important;color:#1b4c7b}
.share-utility{position:fixed;right:max(16px,calc((100vw - 1120px)/2 + 18px));bottom:92px;z-index:19;border:1px solid rgba(132,168,203,.65);background:rgba(238,247,255,.94);color:#28557f;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:850;box-shadow:0 8px 24px rgba(26,70,110,.12);cursor:pointer}
.top-actions{display:flex;gap:8px;align-items:center}.top-guide{border:1px solid rgba(137,171,205,.6);background:rgba(241,248,255,.9);color:#234e78;border-radius:12px;padding:9px 12px;font-weight:850;cursor:pointer}
.otto-decor{position:fixed;right:max(-20px,calc((100vw - 1120px)/2 - 35px));bottom:84px;width:min(250px,23vw);max-height:330px;object-fit:contain;object-position:center bottom;opacity:.11;pointer-events:none;z-index:1;filter:drop-shadow(0 16px 22px rgba(32,72,111,.12))}
.screen>*{position:relative;z-index:2}
.guide-hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:start;margin-bottom:18px}
.guide-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 24px}.guide-tab{border:1px solid rgba(145,177,210,.62);background:rgba(244,250,255,.88);border-radius:999px;padding:10px 14px;font-weight:850;color:#46627d;cursor:pointer}.guide-tab.active{background:#1f5f9f;color:#fff;border-color:#1f5f9f}
.guide-section{border:1px solid rgba(145,177,210,.58);border-radius:22px;background:rgba(247,251,255,.80);margin:12px 0;overflow:hidden}.guide-section summary{cursor:pointer;list-style:none;padding:18px 20px;font-weight:900;display:flex;justify-content:space-between;gap:14px;align-items:center}.guide-section summary::-webkit-details-marker{display:none}.guide-section summary::after{content:"+";font-size:22px;color:#51708f}.guide-section[open] summary::after{content:"–"}.guide-body{padding:0 20px 20px;line-height:1.65;color:#48627a}
.fact-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.fact{border:1px solid rgba(152,182,211,.54);border-radius:18px;padding:16px;background:rgba(239,247,255,.85)}.fact strong{display:block;font-family:Georgia,serif;font-size:22px;margin-top:4px}
.help-drawer{position:fixed;inset:auto 0 0 0;z-index:60;display:flex;justify-content:center;padding:12px}.help-panel{width:min(720px,100%);max-height:82vh;overflow:auto;background:#eaf4ff;border:1px solid #aac5df;border-radius:28px 28px 18px 18px;box-shadow:0 -18px 60px rgba(19,58,96,.22);padding:22px}.help-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.learning-shell{max-width:900px;margin:0 auto}.learning-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.learning-progress{font-weight:900;color:#365a7a}.support-levels{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.support-level{border:1px solid rgba(145,177,210,.65);background:rgba(245,250,255,.88);color:#4a657e;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:850;cursor:pointer}.support-level.active{background:#255f98;color:#fff}
.learning-text{white-space:pre-wrap;font-size:16px;line-height:1.75;border:1px solid rgba(147,179,211,.58);background:rgba(248,252,255,.86);border-radius:22px;padding:22px;margin:16px 0}.translation-box{white-space:pre-wrap;background:rgba(232,244,255,.9);border:1px solid #c8ddf0;border-radius:18px;padding:16px;color:#36536e;line-height:1.65}
.feedback-card{border-radius:22px;padding:19px;border:1px solid}.feedback-card.correct{background:rgba(235,248,240,.94);border-color:#bcdcc9}.feedback-card.wrong{background:rgba(255,239,238,.93);border-color:#e5c0be}.feedback-card blockquote{margin:12px 0;padding-left:14px;border-left:3px solid #6b8ba8;color:#405d77}
.dictionary-list{display:grid;gap:8px;margin-top:12px}.dictionary-row{display:grid;grid-template-columns:minmax(120px,.8fr) minmax(0,1.5fr) auto;gap:12px;align-items:center;border-bottom:1px solid rgba(154,183,211,.42);padding:10px 0}.dictionary-row:last-child{border-bottom:0}.word-audio{width:36px;height:36px;border:1px solid #b4cbe0;border-radius:11px;background:#f3f9ff;color:#234f79;cursor:pointer}
.part-ready{color:#176c4a;background:#eaf7f0}.part-pending{color:#8a5b0a;background:#fff7e5}
.sample-card{border:1px solid rgba(145,177,210,.55);background:rgba(247,251,255,.84);border-radius:20px;padding:18px;margin:12px 0}.sample-text{white-space:pre-wrap;background:rgba(234,244,255,.75);border-radius:16px;padding:15px;line-height:1.65}.template-box{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#e7f2ff;border:1px solid #bdd5eb;border-radius:16px;padding:15px}
.phrase-grid{display:grid;gap:10px}.phrase-row{display:grid;grid-template-columns:minmax(160px,.8fr) minmax(0,1fr);gap:12px;border-bottom:1px solid rgba(151,181,209,.42);padding:10px 0}
.route-human{font-family:Georgia,serif;font-size:30px;margin:0 0 8px}.subtle-label{font-size:11px;font-weight:900;color:#5e7790;text-transform:uppercase;letter-spacing:.08em}
.exam-lock{background:#153c65;color:#fff;border-radius:20px;padding:17px}.exam-lock .muted{color:#c9d8e7}
.review-list{display:grid;gap:12px}
@media(max-width:720px){
  .guide-hero{grid-template-columns:1fr}.fact-grid{grid-template-columns:1fr}.help-actions{grid-template-columns:1fr}.learning-head{display:grid}.phrase-row{grid-template-columns:1fr}.dictionary-row{grid-template-columns:1fr auto}.dictionary-row .dict-ru{grid-column:1}.share-utility{bottom:94px;right:10px}.otto-decor{width:160px;opacity:.055;right:-38px}.top-guide{padding:8px 9px;font-size:12px}.bottom-nav{height:80px}.bottom-nav button small{font-size:9.5px}.otto-nav-face{width:50px;height:50px}
}
@media(max-width:430px){
  .bottom-nav button span{font-size:17px}.bottom-nav button small{font-size:9px}.share-utility{padding:7px 10px;font-size:11px}.guide-section summary{padding:16px}.guide-body{padding:0 16px 16px}
}

  <script>
(function(root,factory){
  const bank=(typeof module==='object'&&module.exports)?require('./diagnostic-bank.js'):root.OTTO_DIAGNOSTIC_BANK;
  const api=factory(bank);
  if(typeof module==='object'&&module.exports)module.exports=api;
  root.OTTO_DIAGNOSTIC_ENGINE=api;
})(typeof globalThis!=='undefined'?globalThis:this,function(BANK){
  'use strict';
  const BANDS=BANK.bands.slice();
  const ITEM_BY_ID=Object.fromEntries(BANK.items.map(i=>[i.item_id,i]));

  function clone(x){return JSON.parse(JSON.stringify(x));}
  function now(){return new Date().toISOString();}
  function createSession(){
    return {
      diagnostic_version:BANK.version,
      phase:'screening_core',
      queue:BANK.screeningSeed.slice(),
      cursor:0,
      answers:[],
      screeningPath:null,
      boundary:null,
      boundaryRounds:0,
      extraTriggered:false,
      closedDecision:null,
      writing:null,
      speaking:[],
      productiveReviews:[],
      completed:false,
      startedAt:now(),
      updatedAt:now()
    };
  }
  function answeredIds(s){return new Set(s.answers.map(a=>a.item_id));}
  function nextItem(s){
    ensureQueue(s);
    if(s.phase==='closed_complete'||s.phase==='writing'||s.phase==='speaking'||s.phase==='complete')return null;
    return ITEM_BY_ID[s.queue[s.cursor]]||null;
  }
  function submitClosed(s,itemId,selectedIndex,meta={}){
    const item=ITEM_BY_ID[itemId];
    if(!item)throw new Error('Unknown diagnostic item '+itemId);
    if(s.queue[s.cursor]!==itemId)throw new Error('Unexpected item order: expected '+s.queue[s.cursor]+' got '+itemId);
    const correct=selectedIndex===item.correct_answer;
    s.answers.push({
      item_id:itemId,
      target_band:item.target_band,
      cefr_level:item.cefr_level,
      skill:item.skill,
      micro_skill:item.micro_skill,
      modality:item.modality,
      correct,
      selectedIndex,
      phase:s.phase,
      boundary_round:s.boundaryRounds,
      duration_ms:meta.duration_ms||null,
      audio_plays:meta.audio_plays||0,
      answeredAt:now()
    });
    s.cursor+=1;s.updatedAt=now();
    ensureQueue(s);
    return {correct,item:clone(item),state:s};
  }
  function ensureQueue(s){
    if(s.cursor<s.queue.length)return;
    if(s.phase==='screening_core'){
      const core=s.answers.filter(a=>a.phase==='screening_core');
      const n=core.filter(a=>a.correct).length;
      const path=n<=1?'low':n===core.length?'high':'middle';
      s.screeningPath=path;
      s.phase='screening_path';
      s.queue=BANK.pathSeeds[path].slice();
      s.cursor=0;
      return;
    }
    if(s.phase==='screening_path'){
      s.boundary=estimateBoundaryFromScreening(s);
      s.boundaryRounds=1;
      s.phase='boundary';
      s.queue=pickBoundaryItems(s,s.boundary,3);
      s.cursor=0;
      return;
    }
    if(s.phase==='boundary'){
      const decision=boundaryDecision(s,s.boundary);
      if(decision.status==='BORDERLINE'&&!s.extraTriggered){
        s.extraTriggered=true;
        s.boundaryRounds+=1;
        s.phase='boundary_extra';
        s.queue=pickBoundaryItems(s,s.boundary,2);
        s.cursor=0;
        return;
      }
      s.closedDecision=decision.status==='BORDERLINE'?finalAmbiguousDecision(s,s.boundary):decision;
      s.phase='closed_complete';
      s.queue=[];s.cursor=0;
      return;
    }
    if(s.phase==='boundary_extra'){
      s.closedDecision=finalBoundaryDecision(s,s.boundary);
      s.phase='closed_complete';
      s.queue=[];s.cursor=0;
    }
  }
  function estimateBoundaryFromScreening(s){
    const by=bandStats(s.answers);
    let highest=-1;
    for(let i=0;i<BANDS.length;i++){
      const st=by[BANDS[i]];
      if(st&&st.n>0&&st.rate>=0.5)highest=i;
    }
    if(highest<0)return [BANDS[0],BANDS[1]];
    if(highest>=BANDS.length-1)return [BANDS[BANDS.length-2],BANDS[BANDS.length-1]];
    return [BANDS[highest],BANDS[highest+1]];
  }
  function bandStats(answers,phasePrefix){
    const out={};
    answers.forEach(a=>{
      if(phasePrefix&&String(a.phase).indexOf(phasePrefix)!==0)return;
      const x=out[a.target_band]||(out[a.target_band]={n:0,correct:0,rate:0});
      x.n++;if(a.correct)x.correct++;x.rate=x.correct/x.n;
    });
    return out;
  }
  function pickBoundaryItems(s,pair,countPerBand){
    const used=answeredIds(s),out=[];
    pair.forEach(b=>{
      const candidates=BANK.items.filter(i=>i.target_band===b&&i.stage_tags.includes('boundary')&&!used.has(i.item_id));
      const skillOrder=['vocabulary','grammar','Lesen','Hören'];
      candidates.sort((a,b2)=>skillOrder.indexOf(a.skill)-skillOrder.indexOf(b2.skill));
      const selected=[];
      for(const item of candidates){
        if(selected.length>=countPerBand)break;
        if(!selected.some(x=>x.skill===item.skill))selected.push(item);
      }
      for(const item of candidates){
        if(selected.length>=countPerBand)break;
        if(!selected.includes(item))selected.push(item);
      }
      out.push(...selected.slice(0,countPerBand).map(i=>i.item_id));
    });
    return interleaveByBand(out,pair);
  }
  function interleaveByBand(ids,pair){
    const a=ids.filter(id=>ITEM_BY_ID[id].target_band===pair[0]);
    const b=ids.filter(id=>ITEM_BY_ID[id].target_band===pair[1]);
    const out=[];const n=Math.max(a.length,b.length);
    for(let i=0;i<n;i++){if(a[i])out.push(a[i]);if(b[i])out.push(b[i]);}
    return out;
  }
  function boundaryEvidence(s,pair){
    const ans=s.answers.filter(a=>(a.phase==='boundary'||a.phase==='boundary_extra')&&pair.includes(a.target_band));
    const stats=bandStats(ans);
    return {lower:stats[pair[0]]||{n:0,correct:0,rate:0},upper:stats[pair[1]]||{n:0,correct:0,rate:0}};
  }
  function boundaryDecision(s,pair){
    const ev=boundaryEvidence(s,pair),lo=ev.lower,up=ev.upper;
    if(lo.n<3||up.n<3)return {status:'BORDERLINE',pair,confidence:'low',reason:'INSUFFICIENT_BOUNDARY_EVIDENCE'};
    if(lo.correct>=2&&up.correct<=1)return makeDecision(pair[0],pair,'medium',ev,'LOWER_SUPPORTED_UPPER_NOT_SUPPORTED');
    if(up.correct===3&&lo.correct>=2)return makeDecision(pair[1],pair,'medium',ev,'UPPER_STRONGLY_SUPPORTED');
    return {status:'BORDERLINE',pair,confidence:'low',evidence:ev,reason:'BOUNDARY_MIXED'};
  }
  function finalBoundaryDecision(s,pair){
    const ev=boundaryEvidence(s,pair),lo=ev.lower,up=ev.upper;
    if(up.n>=4&&up.rate>=0.75&&lo.rate>=0.5)return makeDecision(pair[1],pair,'high',ev,'UPPER_SUPPORTED_AFTER_CONFIRMATION');
    if(lo.n>=4&&lo.rate>=0.75&&up.rate<=0.5)return makeDecision(pair[0],pair,'high',ev,'LOWER_SUPPORTED_AFTER_CONFIRMATION');
    return finalAmbiguousDecision(s,pair);
  }
  function finalAmbiguousDecision(s,pair){
    const ev=boundaryEvidence(s,pair),lo=ev.lower,up=ev.upper;
    const closer=up.rate>lo.rate?pair[1]:pair[0];
    return {
      status:'NEED_CONFIRMATION',
      band:null,
      pair,
      closerTo:closer,
      label:'между '+pair[0]+' и '+pair[1]+'; ближе к '+closer,
      confidence:'low',
      evidence:ev,
      reason:'MIXED_EVIDENCE_AFTER_CONFIRMATION'
    };
  }
  function makeDecision(band,pair,confidence,evidence,reason){
    return {status:'PLACED',band,pair,closerTo:band,label:'ближе к '+band,confidence,evidence,reason};
  }
  function getClosedDecision(s){
    ensureQueue(s);
    return s.closedDecision;
  }
  function selectWritingPrompt(s){
    const idx=estimatedBandIndex(s);
    return clone(BANK.productive.find(p=>p.item_id===(idx<=1?'W-A1':idx<=3?'W-A2':'W-B1')));
  }
  function selectSpeakingPrompts(s){
    const idx=estimatedBandIndex(s);
    if(idx<=1)return [clone(BANK.productive.find(p=>p.item_id==='S-A1'))];
    if(idx<=3)return [clone(BANK.productive.find(p=>p.item_id==='S-A2'))];
    return [
      clone(BANK.productive.find(p=>p.item_id==='S-A2')),
      clone(BANK.productive.find(p=>p.item_id==='S-B1'))
    ];
  }
  function estimatedBandIndex(s){
    const d=s.closedDecision||getClosedDecision(s);
    const b=d&&(d.band||d.closerTo)||'A2.1';
    return Math.max(0,BANDS.indexOf(b));
  }
  function saveWritingSample(s,promptId,text,meta={}){
    s.writing={promptId,text,wordCount:countWords(text),status:'NEEDS_REVIEW',capturedAt:now(),meta};
    s.phase='speaking';s.updatedAt=now();return s;
  }
  function saveSpeakingSample(s,promptId,sampleMeta={}){
    s.speaking.push({promptId,status:'NEEDS_REVIEW',capturedAt:now(),...sampleMeta});
    s.updatedAt=now();return s;
  }
  function markComplete(s){
    s.completed=true;s.phase='complete';s.completedAt=now();s.updatedAt=now();return s;
  }
  function applyProductiveReview(s,skill,band,verdict,meta={}){
    if(!['Schreiben','Sprechen'].includes(skill))throw new Error('Productive review skill must be Schreiben or Sprechen');
    if(!BANDS.includes(band))throw new Error('Unknown band');
    s.productiveReviews.push({skill,band,verdict:!!verdict,review_version:meta.review_version||'manual-test-v1',reviewedAt:now(),...meta});
    s.updatedAt=now();return s;
  }
  function countWords(t){return (String(t||'').match(/[A-Za-zÄÖÜäöüß]+/g)||[]).length;}
  function skillProfile(s,skill){
    if(skill==='Schreiben'||skill==='Sprechen'){
      const reviews=s.productiveReviews.filter(r=>r.skill===skill);
      if(!reviews.length)return {skill,status:'NEED_CONFIRMATION',band:null,confidence:'insufficient',evidenceCount:skill==='Schreiben'?(s.writing?1:0):s.speaking.length,note:'Productive sample captured but not evaluated.'};
      const passed=reviews.filter(r=>r.verdict);
      if(!passed.length)return {skill,status:'REVIEWED_WEAK',band:reviews[0].band,confidence:'medium',evidenceCount:reviews.length};
      const highest=passed.sort((a,b)=>BANDS.indexOf(b.band)-BANDS.indexOf(a.band))[0];
      return {skill,status:'REVIEWED',band:highest.band,confidence:reviews.length>=2?'high':'medium',evidenceCount:reviews.length};
    }
    const relevant=s.answers.filter(a=>a.skill===skill);
    if(!relevant.length)return {skill,status:'NEED_CONFIRMATION',band:null,confidence:'insufficient',evidenceCount:0};
    const stats=bandStats(relevant);let best=null;
    for(const b of BANDS){
      const x=stats[b];
      if(x&&x.n>=2&&x.rate>=0.67)best=b;
    }
    if(!best){
      const anyGood=[...BANDS].reverse().find(b=>stats[b]&&stats[b].correct>0);
      return {skill,status:'NEED_CONFIRMATION',band:anyGood||null,confidence:'low',evidenceCount:relevant.length,stats};
    }
    const x=stats[best];
    return {skill,status:'SUPPORTED',band:best,confidence:x.n>=3?'high':'medium',evidenceCount:relevant.length,stats};
  }
  function languageSystemProfile(s){
    const rel=s.answers.filter(a=>a.skill==='vocabulary'||a.skill==='grammar');
    if(rel.length<4)return {skill:'language_system',status:'NEED_CONFIRMATION',band:null,confidence:'insufficient',evidenceCount:rel.length};
    const stats=bandStats(rel);let best=null;
    for(const b of BANDS){const x=stats[b];if(x&&x.n>=2&&x.rate>=0.67)best=b;}
    if(!best){
      const dec=s.closedDecision;return {skill:'language_system',status:'NEED_CONFIRMATION',band:dec&&(dec.band||dec.closerTo)||null,confidence:'low',evidenceCount:rel.length,stats};
    }
    return {skill:'language_system',status:'SUPPORTED',band:best,confidence:'medium',evidenceCount:rel.length,stats};
  }
  function result(s){
    const d=s.closedDecision||getClosedDecision(s);
    const profiles={
      language_system:languageSystemProfile(s),
      vocabulary:skillProfile(s,'vocabulary'),
      grammar:skillProfile(s,'grammar'),
      Lesen:skillProfile(s,'Lesen'),
      Hören:skillProfile(s,'Hören'),
      Schreiben:skillProfile(s,'Schreiben'),
      Sprechen:skillProfile(s,'Sprechen')
    };
    const gaps=b1Gaps(s,profiles);
    const route=buildInitialRoute(s,profiles,gaps);
    return {
      diagnostic_version:BANK.version,
      placement:d,
      placementDisplay:d.status==='PLACED'?'Текущая учебная зона: '+d.label:'Текущая учебная зона: '+d.label+' — требуется подтверждение',
      officialLevelClaim:false,
      profiles,
      gaps,
      route,
      explanation:explainPlacement(s,d),
      evidenceCount:s.answers.length,
      productiveEvidence:{writing:s.writing?{status:s.writing.status,wordCount:s.writing.wordCount}:null,speaking:s.speaking.map(x=>({promptId:x.promptId,status:x.status,audio:x.audio||false,interaction:x.interaction||false}))}
    };
  }
  function b1Gaps(s,profiles){
    const gaps=[];
    const wrongB1=s.answers.filter(a=>!a.correct&&String(a.target_band).startsWith('B1'));
    wrongB1.forEach(a=>{
      const item=ITEM_BY_ID[a.item_id];
      const key=item.skill+':'+item.micro_skill;
      if(!gaps.some(g=>g.key===key))gaps.push({key,module:item.skill,kind:'B1_EVIDENCE_GAP',micro_skill:item.micro_skill,reason:'Ошибка на независимом B1-oriented диагностическом материале.'});
    });
    if(profiles.Schreiben.status==='NEED_CONFIRMATION')gaps.push({key:'Schreiben:review',module:'Schreiben',kind:'PRODUCTIVE_EVIDENCE_GAP',reason:'Письменный образец сохранён, но ещё не прошёл надёжную оценку.'});
    if(profiles.Sprechen.status==='NEED_CONFIRMATION')gaps.push({key:'Sprechen:review',module:'Sprechen',kind:'PRODUCTIVE_EVIDENCE_GAP',reason:'Речевая выборка не даёт честного уровня без оценки аудио/взаимодействия.'});
    return gaps;
  }
  function buildInitialRoute(s,profiles,gaps){
    const idx=estimatedBandIndex(s);
    if(idx<=1){
      return {
        routeType:'FOUNDATION_FIRST',
        summary:'Сначала языковые предпосылки, затем дозированное знакомство с форматом B1.',
        blocks:[
          {id:'foundation-language',weight:55,label:'База языка',why:'Диагностика указывает на диапазон A1.x: без языковой основы B1 tasks будут слишком сложными.'},
          {id:'foundation-listening-reading',weight:30,label:'Понимание короткой речи и текстов',why:'Нужно укрепить базовое Lesen/Hören до перехода к плотному B1 материалу.'},
          {id:'b1-familiarisation',weight:15,label:'Знакомство с B1',why:'Только лёгкое знакомство с механикой экзамена, без выдачи A1/A2 материала за B1.'}
        ]
      };
    }
    if(idx<=3){
      return {
        routeType:'BRIDGE_TO_B1',
        summary:'Меньше базового курса, больше адресного ремонта пробелов и постепенного B1 practice.',
        blocks:[
          {id:'targeted-language-gaps',weight:35,label:'Точечные языковые пробелы',why:'Уровень уже близок к рабочей зоне A2, поэтому не нужен общий курс с нуля.'},
          {id:'a2-b1-transfer',weight:35,label:'Переход A2 → B1',why:'Нужны более длинные тексты, paraphrase, связность и удержание нескольких условий.'},
          {id:'b1-task-families',weight:30,label:'Goethe B1 task families',why:'Постепенно подключаем формат реального экзамена на подтверждённом B1 контенте.'}
        ]
      };
    }
    return {
      routeType:'B1_EXAM_FOCUSED',
      summary:'Основной вес на экзаменационные task families, независимость, timing, слабые модули и mocks.',
      blocks:[
        {id:'b1-targeted-gaps',weight:30,label:'Слабые микронавыки',why:gaps.length?gaps[0].reason:'B1 база близка к целевой; работаем точечно.'},
        {id:'b1-task-families',weight:45,label:'Goethe B1 task families',why:'Главный приоритет — устойчивое выполнение реальных типов заданий.'},
        {id:'b1-independent-proof',weight:25,label:'Timing + mocks',why:'Нужно доказать результат без подсказок на новых материалах.'}
      ]
    };
  }
  function explainPlacement(s,d){
    const ev=d.evidence||{};
    if(d.status==='PLACED'){
      return [
        'Решение основано на нескольких независимых заданиях около границы '+d.pair.join(' / ')+'.',
        'Один правильный или один неправильный ответ сам по себе уровень не меняет.',
        'Boundary evidence: '+formatEvidence(ev)+'.',
        'Внутренние зоны .1/.2 используются только для маршрута OTTO и не являются официальной сертификацией CEFR.'
      ];
    }
    return [
      'Результат на границе '+d.pair.join(' / ')+' остался смешанным даже после дополнительных проверок.',
      'Поэтому OTTO не присваивает точную зону и помечает результат как NEED_CONFIRMATION.',
      'Boundary evidence: '+formatEvidence(ev)+'.'
    ];
  }
  function formatEvidence(ev){
    if(!ev.lower||!ev.upper)return 'недостаточно данных';
    return 'нижняя зона '+ev.lower.correct+'/'+ev.lower.n+', верхняя зона '+ev.upper.correct+'/'+ev.upper.n;
  }
  function validateBank(){
    const required=['diagnostic_version','item_id','modality','skill','target_band','difficulty_boundary','grammar_tags','vocabulary_function_tags','cefr_alignment_note','source_basis','expected_duration_seconds','scoring_rule','contributes_to_placement','contributes_to_b1_exam_gap','qa_status','original_aligned'];
    const errors=[];
    BANK.items.concat(BANK.productive).forEach(item=>{
      required.forEach(k=>{if(item[k]===undefined||item[k]===null||item[k]==='')errors.push(item.item_id+': missing '+k);});
      if(!BANDS.includes(item.target_band))errors.push(item.item_id+': unknown target_band');
      if(item.original_aligned!==true)errors.push(item.item_id+': not original_aligned');
      if(String(item.publish_status).includes('B1')&&String(item.target_band).startsWith('A1'))errors.push(item.item_id+': A1 mislabeled as B1');
    });
    return {ok:errors.length===0,errors,count:BANK.items.length,productive:BANK.productive.length};
  }

  return {
    BANDS,createSession,nextItem,submitClosed,getClosedDecision,selectWritingPrompt,selectSpeakingPrompts,
    saveWritingSample,saveSpeakingSample,markComplete,applyProductiveReview,skillProfile,languageSystemProfile,
    result,buildInitialRoute,validateBank,estimateBoundaryFromScreening,boundaryDecision,finalBoundaryDecision
  };
});

function stageTitle(phase){
  if(phase==='screening_core'||phase==='screening_path')return 'Определяем ваш стартовый уровень';
  if(phase==='boundary'||phase==='boundary_extra')return 'Уточняем результат';
  if(phase==='closed_complete'||phase==='writing')return 'Проверяем письменную речь';
  if(phase==='speaking')return 'Проверяем устную речь';
  return 'Готовим результат';
}
function phaseCopy(phase){
  if(phase==='screening_core')return 'Начинаем с заданий разной сложности и постепенно сужаем диапазон.';
  if(phase==='screening_path')return 'Otto уже подбирает следующие задания по вашим ответам.';
  if(phase==='boundary')return 'Нужно ещё несколько независимых ответов, чтобы не делать вывод по одной случайной попытке.';
  if(phase==='boundary_extra')return 'Ответы получились близкими по уровню, поэтому Otto добавил короткую перепроверку.';
  return '';
}
function remainingMinutes(){
  const s=S.diagnostic.session;
  if(s.phase==='screening_core'||s.phase==='screening_path'||s.phase==='boundary'||s.phase==='boundary_extra'){
    const ids=s.queue.slice(s.cursor),secs=ids.reduce((sum,id)=>{
      const item=BANK.items.find(x=>x.item_id===id);
      return sum+(item?.expected_duration_seconds||45);
    },0);
    return Math.max(1,Math.ceil((secs+360)/60));
  }
  if(s.phase==='closed_complete'||s.phase==='writing')return 8;
  if(s.phase==='speaking')return Math.max(2,4-S.diagnostic.speakingIndex);
  return 0;
}
function currentItem(){
  const item=ENGINE.nextItem(S.diagnostic.session);
  if(item&&S.diagnostic.activeItemId!==item.item_id){
    S.diagnostic.activeItemId=item.item_id;
    S.diagnostic.itemStartedAt=Date.now();
    save();
  }
  return item;
}
function renderClosed(item){
  let html='';
  if(item.text)html+='<div class="task-text">'+esc(item.text).replace(/\n/g,'<br>')+'</div>';
  if(item.modality==='audio'){
    const used=S.diagnostic.audioPlays[item.item_id]||0;
    html+='<div class="audio-card"><div><b>Проверяем понимание речи</b><div class="small">Диагностическое аудио можно прослушать до 2 раз. Прослушано: '+used+'/2.</div></div>'+button('▶ Воспроизвести','diag-audio','secondary',used>=2?'disabled':'')+'</div>';
  }
  html+='<p class="lead" style="font-size:17px"><b>'+esc(item.prompt)+'</b></p><div class="choice-grid">';
  item.options.forEach((o,i)=>html+='<button class="choice" data-diag-choice="'+i+'">'+esc(o)+'</button>');
  html+='</div>';
  return html;
}
function diagnosticView(){
  const s=S.diagnostic.session;
  if(s.completed||s.phase==='complete')return reportView();
  if(s.phase==='closed_complete'||s.phase==='writing'||s.phase==='speaking')return productiveView();
  const item=currentItem();
  if(!item)return '<div class="notice">Otto пересчитывает следующий шаг диагностики…</div>';
  const pct=s.phase==='screening_core'?18:s.phase==='screening_path'?35:s.phase==='boundary'?55:s.phase==='boundary_extra'?68:75;
  const human=item.modality==='audio'?'Понимание речи':item.skill==='Lesen'?'Чтение':item.skill==='grammar'?'Грамматика':item.skill==='vocabulary'?'Лексика':'Языковая база';
  return '<span class="eyebrow">'+stageTitle(s.phase)+'</span><div class="diag-top"><div><h1 class="h2">'+human+'</h1><p class="muted">'+phaseCopy(s.phase)+'</p></div><div class="time-left">≈ '+remainingMinutes()+' мин.</div></div><div class="progress-line"><i style="width:'+pct+'%"></i></div>'+renderClosed(item)+'<p class="small">Каждый ответ сохраняется автоматически. Закрыли страницу — продолжите с этого места.</p>';
}
function answerDiagnostic(index){
  const s=S.diagnostic.session,item=currentItem();
  if(!item)return;
  const duration=S.diagnostic.itemStartedAt?Date.now()-S.diagnostic.itemStartedAt:null;
  const audio=S.diagnostic.audioPlays[item.item_id]||0;
  ENGINE.submitClosed(s,item.item_id,Number(index),{duration_ms:duration,audio_plays:audio});
  S.diagnostic.activeItemId=null;S.diagnostic.itemStartedAt=null;save();render();
}
function playDiagnosticAudio(){
  const item=currentItem();if(!item||item.modality!=='audio')return;
  const used=S.diagnostic.audioPlays[item.item_id]||0;
  if(used>=2)return;
  S.diagnostic.audioPlays[item.item_id]=used+1;save();
  if(!('speechSynthesis'in window))return alert('Системная немецкая озвучка недоступна в этом браузере.');
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(item.audio_script);
  u.lang='de-DE';
  u.rate=item.target_band.startsWith('B1')?.96:item.target_band.startsWith('A2')?.90:.82;
  speechSynthesis.speak(u);
  render();
}

function countGermanWords(text){return (String(text||'').match(/[A-Za-zÄÖÜäöüß]+/g)||[]).length;}
function writingGate(text,prompt){
  const words=countGermanWords(text),cyr=(String(text||'').match(/[А-Яа-яЁё]+/g)||[]).length;
  const min=prompt.target_band.startsWith('B1')?45:prompt.target_band.startsWith('A2')?30:15;
  return {words,cyr,valid:words>=min&&words>cyr*2,min};
}

    '<div id="recordBox" class="record-box '+(recorder&&recorder.state==='recording'?'recording':'')+'"><span class="record-dot"></span><b> Реальная запись микрофона</b><div class="button-row" style="justify-content:center">'+button(recorder&&recorder.state==='recording'?'■ Остановить':'🎙 Начать запись','record-speaking','secondary')+'</div></div><div class="notice">Transcript ≠ оценка Sprechen. Без отдельной audio/rubric evaluation мы не придумываем pronunciation, fluency или B1.1/B1.2.</div><div class="button-row">'+button('Сохранить этот sample','finish-speaking')+button('Нет доступа к микрофону','skip-speaking','ghost')+'</div>';
}
async function toggleSpeakingRecord(){
  if(recorder&&recorder.state==='recording'){
    recorder.stop();recorder.stream.getTracks().forEach(t=>t.stop());return;
  }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    chunks=[];recorder=new MediaRecorder(stream);recorder.stream=stream;
    recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
    recorder.onstop=()=>{
      const bytes=chunks.reduce((n,b)=>n+b.size,0);
      S.diagnostic.lastRecording={recorded:bytes>0,bytes,savedAt:now()};
      save();recorder=null;render();
    };
    recorder.start();render();
  }catch(e){alert('Нет доступа к микрофону: '+e.message);}
}
function finishSpeaking(skipped=false){
  const s=S.diagnostic.session,prompts=ENGINE.selectSpeakingPrompts(s),p=prompts[S.diagnostic.speakingIndex];
  if(!p){ENGINE.markComplete(s);S.diagnostic.result=ENGINE.result(s);save();return go('report');}
  if(!skipped&&!S.diagnostic.lastRecording?.recorded)return alert('Сначала запишите речевой sample или выберите «Нет доступа к микрофону».');
  ENGINE.saveSpeakingSample(s,p.item_id,{
    audio:!skipped,
    bytes:skipped?0:S.diagnostic.lastRecording.bytes,
    interaction:p.item_id==='S-B1',
    evaluation_status:skipped?'NEED_CONFIRMATION':'NEEDS_REVIEW'
  });
  S.diagnostic.lastRecording=null;
  S.diagnostic.speakingIndex++;
  if(S.diagnostic.speakingIndex>=prompts.length){
    ENGINE.markComplete(s);
    S.diagnostic.result=ENGINE.result(s);
    save();go('report');
  }else{save();render();}
}
function speakOtto(){

}

function reportView(){

  let html='<div class="learning-shell"><div class="learning-head"><div><span class="eyebrow">'+(exam?'Exam-like':'Training · русская поддержка')+'</span><h1 class="h2">'+(exam?'Lesen · Teil 1':'Lesen Teil 1 — верно или неверно')+'</h1></div><div class="learning-progress">'+(exam?('Aufgabe '+(i+1)+' / 6'):('Задание '+(i+1)+' из 6'))+'</div></div><div class="progress-line"><i style="width:'+(((i+1)/6)*100)+'%"></i></div>';
  if(exam)html+='<div class="exam-lock"><b>Prüfungsmodus.</b> Keine Übersetzung, kein Wörterbuch und keine Tipps während der Bearbeitung.</div>';
  else html+=supportLevels();
  html+='<div class="card soft"><div class="small">Немецкая инструкция</div><b>'+esc(task.german_instruction)+'</b></div>';
  if(!exam)html+=trainingTools(task);
  html+='<div class="learning-text">'+esc(task.text)+'</div><div class="card"><span class="subtle-label">Утверждение '+(i+1)+'</span><h3>'+esc(q.statement)+'</h3>';
  if(!exam&&l.translation)html+='<div class="translation-box">'+esc(q.translation)+'</div>';
  html+='<div class="choice-grid"><button class="choice '+(l.answers[i]===0?'selected':'')+'" data-learn-choice="0" '+(l.checked[i]?'disabled':'')+'>Richtig</button><button class="choice '+(l.answers[i]===1?'selected':'')+'" data-learn-choice="1" '+(l.checked[i]?'disabled':'')+'>Falsch</button></div></div>';
  if(!exam&&l.checked[i])html+=learningFeedback(task,q,i);
  html+='<div class="button-row">';
  if(i>0)html+='<button class="btn ghost" data-action="learn-back">← Назад</button>';
  if(exam){
    html+='<button class="btn primary" data-action="learn-exam-next">'+(i===5?'Завершить Teil':'Далее →')+'</button>';
  }else if(!l.checked[i]){
    html+='<button class="btn primary" data-action="learn-check">Проверить</button>';
  }else{
    html+='<button class="btn primary" data-action="learn-next">'+(i===5?'Завершить Teil':'Далее →')+'</button>';
  }
  html+='</div></div>';return html;
}
function saveLearningEvidence(i){
  const task=learningTask(),q=task.questions[i],sel=S.learning.answers[i],correct=(sel===0)===q.correct,flags=assistanceFlags();
  S.learning.answerEvidence[i]=Object.assign({task_id:task.task_id,question_id:q.id,correct:correct,label:'доказательство / '+(i===4?'изменение плана':i===5?'условие':'деталь')},flags,{at:now()});
  save();
}
function learnCheck(){
  const i=S.learning.index;if(S.learning.answers[i]==null)return alert('Сначала выберите Richtig или Falsch.');
  if(!S.learning.checked[i]){S.learning.checked[i]=true;saveLearningEvidence(i);}
  save();render();
}
function learnNext(){
  if(S.learning.index===5){S.learning.completed=true;save();go('learn-summary');return;}
  S.learning.index++;S.learning.translation=false;S.learning.instructionHelp=false;S.learning.strategy=false;S.learning.dictionary=false;save();render();
}
function learnExamNext(){
  const i=S.learning.index;if(S.learning.answers[i]==null)return alert('Сначала выберите Richtig или Falsch.');
  if(!S.learning.checked[i]){S.learning.checked[i]=true;saveLearningEvidence(i);}
  if(i===5){S.learning.completed=true;save();go('learn-summary');return;}
  S.learning.index++;save();render();
}
function learnBack(){if(S.learning.index>0){S.learning.index--;save();render();}}
function learningSummaryView(){
  const task=learningTask(),ev=Object.values(S.learning.answerEvidence),score=ev.filter(function(x){return x.correct;}).length;
  let html='<div class="learning-shell"><span class="eyebrow">'+(S.learning.mode==='exam'?'Exam-like завершён':'Teil завершён')+'</span><h1 class="h2">'+score+' / 6</h1><p class="lead">Главное не число само по себе, а то, какие ошибки повторились и сколько помощи потребовалось.</p>';
  const assisted=ev.filter(function(x){return x.assisted;}).length;
  html+=card('Самостоятельность','Попыток с учебной помощью: '+assisted+' из '+ev.length+'. Перевод или стратегия до ответа делают evidence assisted.','soft');
  const wrong=ev.filter(function(x){return !x.correct;});
  html+=card('Что Otto будет учитывать дальше',wrong.length?'Нужно вернуться к '+wrong.map(function(x){return x.label;}).join(', ')+'.':'В этом Teil явных повторяющихся ошибок пока не видно. Для устойчивого вывода нужны новые тексты.',''+(wrong.length?'warn':'good'));
  if(S.learning.mode==='exam'&&!S.learning.review){
    html+='<div class="button-row">'+button('Разобрать ответы','learn-review','secondary')+button('Вернуться к Lesen','learn-module','ghost')+'</div></div>';return html;
  }
  if(S.learning.review){
    html+='<h3>Разбор после Exam</h3><div class="review-list">';
    task.questions.forEach(function(q,i){html+=learningFeedback(task,q,i);});
    html+='</div>';
  }
  html+='<div class="button-row">'+button('Вернуться к Lesen','learn-module','primary')+button('Открыть Гид Lesen','learn-guide','ghost')+'</div></div>';return html;
}
function speakText(text){
  if(!('speechSynthesis' in window))return alert('В этом браузере недоступна системная немецкая озвучка.');
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.rate=.92;speechSynthesis.speak(u);
}
async function shareApp(){
  const data={url:location.origin+location.pathname};
  try{
    if(navigator.share){await navigator.share(data);return;}
    if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(data.url);alert('Ссылка скопирована.');return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  const ta=document.createElement('textarea');ta.value=data.url;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();alert('Ссылка скопирована.');
}


function render(){
  normalizeRuntimeState();
  let r=route();
  if(!S.auth.verified&&!['register','verify'].includes(r)){r='register';history.replaceState(null,'','#register');}
  if(S.auth.verified&&!S.diagnostic.session.completed&&!['diagnostic-gate','diagnostic'].includes(r)){r='diagnostic-gate';history.replaceState(null,'','#diagnostic-gate');}
  const views={
    register:registerView,verify:verifyView,'diagnostic-gate':diagnosticGate,diagnostic:diagnosticView,
    report:reportView,home:homeView,route:routeView,modules:modulesView,module:moduleView,
    guide:guideView,learn:learnView,'learn-summary':learningSummaryView,
    errors:errorsView,progress:progressView
  };
  $('#screen').innerHTML=(views[r]||registerView)();
  const locked=['register','verify','diagnostic-gate','diagnostic'].includes(r);
  $('#bottomNav').classList.toggle('hidden',locked);
  $('#guideButton').classList.toggle('hidden',locked);
  $('#shareButton').classList.toggle('hidden',locked);
  $('#ottoDecor').classList.toggle('hidden',locked);
  $('#ottoDecor').src=window.OTTO_SRC||'';
  $('#ottoNavImg').src=window.OTTO_SRC||'';
  document.querySelectorAll('[data-nav]').forEach(function(b){b.classList.toggle('active',b.dataset.nav===r);});
  renderModal();
}

function click(e){
  const nav=e.target.closest('[data-nav]');if(nav){go(nav.dataset.nav);return;}
  const guideTab=e.target.closest('[data-guide-module]');if(guideTab){S.selectedGuide=guideTab.dataset.guideModule;save();render();return;}
  const startLearn=e.target.closest('[data-start-learning]');if(startLearn){startLearning(Number(startLearn.dataset.startLearning),'training');return;}
  const startExam=e.target.closest('[data-start-exam]');if(startExam){startLearning(Number(startExam.dataset.startExam),'exam');return;}
  const learnChoice=e.target.closest('[data-learn-choice]');if(learnChoice){if(!S.learning.checked[S.learning.index]){S.learning.answers[S.learning.index]=Number(learnChoice.dataset.learnChoice);save();render();}return;}
  const support=e.target.closest('[data-support-level]');if(support){S.learning.supportLevel=Number(support.dataset.supportLevel);S.learning.translation=false;S.learning.instructionHelp=false;S.learning.strategy=false;S.learning.dictionary=false;save();render();return;}
  const speakWord=e.target.closest('[data-speak-word]');if(speakWord){speakText(speakWord.dataset.speakWord);return;}
  const mod=e.target.closest('[data-module]');if(mod){S.selectedModule=mod.dataset.module;S.selectedGuide=S.selectedModule;save();go('module');return;}
  const mins=e.target.closest('[data-minutes]');if(mins){captureRegistrationDraft();S.dailyMinutes=Number(mins.dataset.minutes);save();render();return;}
  const ch=e.target.closest('[data-diag-choice]');if(ch){answerDiagnostic(Number(ch.dataset.diagChoice));return;}
  const a=e.target.closest('[data-action]');if(!a)return;
  const x=a.dataset.action;
  if(x==='auth-email'){captureRegistrationDraft();S.auth.method='email';save();render();}
  else if(x==='auth-telegram'){captureRegistrationDraft();S.auth.method='telegram';save();render();}
  else if(x==='register-submit')submitRegistration();
  else if(x==='verify')finishVerification();
  else if(x==='back-register')go('register');
  else if(x==='diag-start')startDiagnostic();
  else if(x==='diag-resume')go('diagnostic');
  else if(x==='diag-audio')playDiagnosticAudio();
  else if(x==='save-writing')saveWriting();
  else if(x==='record-speaking')toggleSpeakingRecord();
  else if(x==='finish-speaking')finishSpeaking(false);
  else if(x==='skip-speaking')finishSpeaking(true);
  else if(x==='speak-otto')speakOtto();
  else if(x==='open-route')go('route');
  else if(x==='open-home')go('home');
  else if(x==='open-modules')go('modules');
  else if(x==='open-progress')go('progress');
  else if(x==='open-guide'){S.selectedGuide=S.selectedGuide||S.selectedModule||'Lesen';save();go('guide');}
  else if(x==='open-guide-module'){S.selectedGuide=S.selectedModule;save();go('guide');}
  else if(x==='guide-to-module'){S.selectedModule=S.selectedGuide;save();go('module');}
  else if(x==='open-help')openHelp();
  else if(x==='help-open-guide'){S.ui.helpOpen=false;S.selectedGuide=S.selectedModule;save();go('guide');}
  else if(x==='otto-open-guide'){S.ui.ottoOpen=false;S.selectedGuide=S.selectedModule||'Lesen';save();go('guide');}
  else if(x==='ask-otto'){S.ui.ottoOpen=true;S.ui.helpOpen=false;save();renderModal();}
  else if(x==='close-modal'){S.ui.helpOpen=false;S.ui.ottoOpen=false;save();renderModal();}
  else if(x==='share-app')shareApp();
  else if(x==='guide-speak-sample')speakText(GUIDE.modules.Sprechen.presentation.sample);
  else if(x==='instruction-help'){S.learning.instructionHelp=!S.learning.instructionHelp;if(S.learning.instructionHelp)recordAssistance('instruction_help','Lesen Teil 1');save();render();}
  else if(x==='toggle-translation'){S.learning.translation=!S.learning.translation;if(S.learning.translation)recordAssistance('translation_used','Lesen Teil 1');save();render();}
  else if(x==='toggle-strategy'){S.learning.strategy=!S.learning.strategy;if(S.learning.strategy)recordAssistance('strategy_used','Lesen Teil 1');save();render();}
  else if(x==='toggle-dictionary'){S.learning.dictionary=!S.learning.dictionary;if(S.learning.dictionary)recordAssistance('dictionary_used','Lesen Teil 1');save();render();}
  else if(x==='dictionary-all'){S.learning.dictionaryAll=!S.learning.dictionaryAll;save();render();}
  else if(x==='learn-check')learnCheck();
  else if(x==='learn-next')learnNext();
  else if(x==='learn-exam-next')learnExamNext();
  else if(x==='learn-back')learnBack();
  else if(x==='learn-review'){S.learning.review=true;save();render();}
  else if(x==='learn-module'){S.selectedModule='Lesen';save();go('module');}
  else if(x==='learn-guide'){S.selectedGuide='Lesen';save();go('guide');}
}
document.addEventListener('click',click);
$('#resetButton').addEventListener('click',()=>{if(confirm('Сбросить данные Beta и диагностику?'))reset();});
window.addEventListener('popstate',render);
window.addEventListener('hashchange',render);

window.__OTTO_TEST__={
  getState:()=>JSON.parse(JSON.stringify(S)),
  setState:x=>{S=x;save();render();},
  currentItem:()=>{const x=ENGINE.nextItem(S.diagnostic.session);return x?JSON.parse(JSON.stringify(x)):null;},
  result:()=>S.diagnostic.session.completed?ENGINE.result(S.diagnostic.session):null,
  engine:ENGINE,
  bank:BANK
};

if(!location.hash)history.replaceState(null,'','#register');
render();

  </script>
