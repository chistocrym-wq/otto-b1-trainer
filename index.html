<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b4f3c"><title>OTTO B1</title><style>
:root{--bg:#f3eee7;--card:#fffdf9;--ink:#3b3028;--muted:#7c6d61;--brand:#5c4434;--soft:#eadfd3;--ok:#e9eee3;--warn:#f7ead7;--bad:#f6e7e2}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 30% 0,#eee4d8,#f3eee7 46%,#ece5dc);color:var(--ink)}button,input,textarea{font:inherit}.wrap{min-height:100vh;display:grid;place-items:start center;padding:22px}.app{width:min(100%,430px);min-height:820px;background:#fff;border-radius:32px;overflow:hidden;box-shadow:0 22px 65px #49342524;position:relative;border:1px solid #5c443414}.head{height:62px;display:flex;align-items:center;justify-content:space-between;padding:9px 13px;border-bottom:1px solid #eee8e1;position:sticky;top:0;background:#fffc;backdrop-filter:blur(12px);z-index:5}.icon{width:44px;height:44px;border:0;border-radius:13px;background:transparent;font-size:22px;color:var(--ink)}.titlebar{font-weight:900;font-size:14px}.screen{padding:20px 18px 100px;min-height:680px}.hero{min-height:285px;border-radius:28px;padding:25px;color:#fff;background:linear-gradient(135deg,#927157,#604637);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:230px;height:230px;border-radius:50%;background:#ffffff15;right:-65px;top:-35px}.otto{width:128px;height:128px;border-radius:36px;background:#fff2;color:inherit;display:grid;place-items:center;font-weight:950;font-size:25px;border:1px solid #ffffff30;margin:18px auto}.hero h1{font-size:34px;margin:4px 0 8px}.hero p{color:#f6eadf;line-height:1.45}.eyebrow{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#8b6a52}.h1{font-size:28px;line-height:1.08;margin:6px 0 10px}.sub{color:var(--muted);font-size:14px;line-height:1.5}.card{background:var(--card);border:1px solid #e8e0d8;border-radius:20px;padding:16px;margin:11px 0}.soft{background:#f7f1eb}.ok{background:var(--ok)}.warn{background:var(--warn)}.bad{background:var(--bad)}.btn{width:100%;border:0;border-radius:16px;padding:15px 16px;min-height:50px;font-weight:850;margin-top:10px;cursor:pointer}.primary{background:var(--brand);color:#fff}.secondary{background:var(--soft);color:var(--brand)}.ghost{background:#fff;border:1px solid #e3dbd3}.row{display:flex;gap:9px}.row>*{flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.module{border:1px solid #e8e0d8;border-radius:18px;padding:14px;background:#fff;text-align:left}.module b{display:block}.module small{color:var(--muted)}.option{display:block;width:100%;text-align:left;border:1px solid #e3dbd3;border-radius:14px;background:#fff;padding:13px;margin:8px 0}.option.sel{border-color:#8b6a52;background:#f7f1eb}.field{width:100%;border:1px solid #ddd3ca;border-radius:14px;padding:14px;margin:8px 0;outline:none}.field:focus{border-color:#8b6a52;box-shadow:0 0 0 4px #eadfd3}.nav{height:78px;position:absolute;bottom:0;left:0;right:0;display:flex;background:#fffc;backdrop-filter:blur(12px);border-top:1px solid #eee8e1;z-index:4}.nav button{flex:1;border:0;background:none;font-size:11px;color:#766a61}.nav span{display:block;font-size:20px}.pill{display:inline-block;padding:7px 10px;border-radius:999px;background:#f3eee7;font-size:10px;font-weight:850;margin:3px}.bar{height:8px;background:#ebe4dd;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#76533f}.map{position:fixed;inset:0;background:#4b392f;color:#fff;padding:24px;overflow:auto;z-index:20;transform:translateX(-100%);transition:.2s}.map.open{transform:none}.map button{width:100%;text-align:left;padding:10px;border:0;border-radius:10px;background:#ffffff0f;color:#fff;margin:3px 0}.map .close{background:#fff;color:#4b392f;margin:14px 0}.notice{padding:13px;border-radius:15px;background:#f7f1eb;font-size:12px;line-height:1.45}.big{font-size:38px;font-weight:950}.center{text-align:center}.muted{color:var(--muted)}.hide{display:none!important}.record{width:110px;height:110px;border-radius:50%;border:0;background:#6b4f3c;color:#fff;font-size:32px;display:grid;place-items:center;margin:25px auto}.record.on{box-shadow:0 0 0 16px #eadfd3}@media(max-width:520px){.wrap{padding:0}.app{width:100%;min-height:100vh;border-radius:0;border:0}.screen{min-height:calc(100vh - 140px)}}
</style></head><body><div id="map" class="map"><h2>Карта OTTO B1</h2><div id="mapItems"></div><button class="close" onclick="toggleMap()">Закрыть</button></div><div class="wrap"><main class="app"><header class="head"><button id="back" class="icon">‹</button><div id="barTitle" class="titlebar">OTTO B1</div><button class="icon" onclick="toggleMap()">☰</button></header><section id="screen" class="screen"></section><nav id="nav" class="nav"><button onclick="go('home')"><span>⌂</span>Главная</button><button onclick="go('route')"><span>⇢</span>Маршрут</button><button onclick="go('errors')"><span>!</span>Ошибки</button><button onclick="go('progress')"><span>◔</span>Прогресс</button></nav></main></div><script>
const SCREENS=[['splash','Splash / вход'],['intro','Знакомство с Отто B1'],['register','Регистрация / имя'],['goal','Цель / дата экзамена'],['diag-start','Начало диагностики'],['diag-reading','Диагностика Lesen'],['diag-listening','Диагностика Hören'],['diag-writing','Диагностика Schreiben'],['diag-speaking','Диагностика Sprechen'],['diag-adaptive','Адаптивная диагностика'],['analysis','Экран анализа'],['skill-map','Карта сильных / слабых мест'],['personal-route','Готовый персональный маршрут'],['home','Главный экран'],['route','Экран маршрута'],['today','Занятие на сегодня'],['time','Выбор 10 / 25 / 45 минут'],['lesen','Lesen-задание'],['hoeren','Hören-задание'],['schreiben','Schreiben-задание'],['writing-review','Проверка Schreiben'],['sprechen','Sprechen-задание'],['record','Запись голоса'],['speaking-review','Анализ Sprechen'],['strategy','Стратегия Отто'],['hint','Совет Отто'],['wrong','Неправильный ответ'],['why','Почему ты ошибся'],['errors','Мои ошибки'],['progress','Прогресс'],['exam','Экзаменационный режим'],['exam-result','Результат пробного экзамена'],['readiness','Индекс готовности'],['reroute','Изменение маршрута'],['states','Состояния / ошибки интерфейса']];
const TITLES=Object.fromEntries(SCREENS);const by=id=>document.getElementById(id);let mem={};const load=()=>{try{return JSON.parse(localStorage.ottoB1||'{}')}catch{return mem}},save=s=>{mem=s;try{localStorage.ottoB1=JSON.stringify(s)}catch{}};let S=Object.assign({name:'',examDate:'',daily:25,attempts:[],errors:[],writing:[],speaking:[],diag:{},history:[],exam:[]},load());let selected=null,rec=null,chunks=[];
function esc(x=''){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function persist(){save(S)}function current(){return location.hash.replace(/^#\/?/,'')||'splash'}function go(r){if(!TITLES[r])r='home';const c=current();if(c!==r)S.history.push(c);persist();location.hash='#/'+r;render()}function back(){go(S.history.pop()||(S.name?'home':'splash'))}function toggleMap(){by('map').classList.toggle('open')}function card(t,p='',cl=''){return `<div class="card ${cl}"><b>${t}</b>${p?`<p class="sub">${p}</p>`:''}</div>`}function btn(t,r,cl='primary'){return `<button class="btn ${cl}" onclick="go('${r}')">${t}</button>`}function modules(){return `<div class="grid"><button class="module" onclick="go('lesen')"><b>📖 Lesen</b><small>тексты и перефразирование</small></button><button class="module" onclick="go('hoeren')"><b>🎧 Hören</b><small>смысл и Distraktoren</small></button><button class="module" onclick="go('schreiben')"><b>✍️ Schreiben</b><small>задача и структура</small></button><button class="module" onclick="go('sprechen')"><b>🎙️ Sprechen</b><small>реакция и связность</small></button></div>`}
function evidence(m){return S.attempts.filter(a=>a.module===m).length}function status(m){let n=evidence(m);if(n<3)return 'Недостаточно данных';let a=S.attempts.filter(x=>x.module===m),ok=a.filter(x=>x.ok).length/a.length;return ok>=.8?'Стабильно':ok>=.6?'Нестабильно':'Нужно усилить'}function recordAttempt(module,skill,ok){S.attempts.push({module,skill,ok,at:Date.now()});if(!ok)S.errors.push({module,skill,at:Date.now()});persist()}
const R={
splash:()=>`<div class="hero center"><div class="otto">OTTO<br>B1</div><h1>OTTO B1</h1><p>Персональный тренажёр подготовки к Goethe-Zertifikat B1</p><button class="btn ghost" onclick="go('intro')">Начать</button></div>`,
intro:()=>`<span class="eyebrow">Персональный маршрут</span><h1 class="h1">Я — Отто. Сначала пойму, что именно тебе мешает.</h1><p class="sub">Не общий процент, а микропробелы: перефразирование, отрицания, Distraktoren, пункты письма, реакция в диалоге.</p>${card('Диагностика → маршрут → тренировка → перепроверка','Маршрут будет меняться по мере появления новых доказательств навыка.','soft')}${btn('Продолжить','register')}`,
register:()=>`<span class="eyebrow">Шаг 1</span><h1 class="h1">Как тебя зовут?</h1><input id="name" class="field" value="${esc(S.name)}" placeholder="Имя"><button class="btn primary" onclick="S.name=by('name').value.trim()||'Ученик';persist();go('goal')">Продолжить</button>`,
goal:()=>`<span class="eyebrow">Шаг 2</span><h1 class="h1">Когда нужен сертификат?</h1><input id="date" type="date" class="field" value="${esc(S.examDate)}"><p class="sub">Дата помогает определить темп, но не заменяет реальные результаты.</p><button class="btn primary" onclick="S.examDate=by('date').value;persist();go('diag-start')">К диагностике</button>`,
'diag-start':()=>`<span class="eyebrow">Диагностика</span><h1 class="h1">Проверим четыре модуля</h1>${modules()}${card('Важно','Трёх ответов недостаточно, чтобы объявить готовность B1. Мы накапливаем доказательства.')}${btn('Начать с Lesen','diag-reading')}`,
'diag-reading':()=>mc('Lesen','purpose_vs_result','Почему библиотека ввела автоматы?',['Чтобы заменить сотрудников','Чтобы дать сотрудникам больше времени на консультации','Чтобы сократить число посетителей'],1,'diag-listening'),
'diag-listening':()=>`<span class="eyebrow">Диагностика Hören</span><h1 class="h1">Прослушай объявление</h1>${card('Audio demo','Нажми воспроизвести. На этой стадии используется браузерная немецкая озвучка.')}<button class="btn secondary" onclick="speak('Wegen einer technischen Störung fährt der Regionalzug heute nur bis Mannheim. Reisende nach Heidelberg steigen bitte in Mannheim in den Ersatzbus um.')">▶ Воспроизвести</button><p><b>Что нужно сделать пассажирам в Heidelberg?</b></p>${opts(['Остаться в поезде','В Mannheim пересесть на автобус','Ехать через Frankfurt'])}<button class="btn primary" onclick="submitMC('Hören','detail_understanding',1,'diag-writing')">Ответить</button>`,
'diag-writing':()=>`<span class="eyebrow">Диагностика Schreiben</span><h1 class="h1">Напиши короткое сообщение</h1><p class="sub">Ты опаздываешь на встречу. Извинись, назови причину и предложи новое время.</p><textarea id="w" class="field" rows="7" placeholder="Schreibe auf Deutsch…"></textarea><button class="btn primary" onclick="submitWriting('diag-speaking')">Проверить входной фильтр</button>`,
'diag-speaking':()=>`<span class="eyebrow">Диагностика Sprechen</span><h1 class="h1">Расскажи о своём плане на выходные</h1><p class="sub">Запись используется как доказательство попытки. Произношение и беглость без ASR/AI не выдумываются.</p>${btn('Открыть запись','record')}`,
'diag-adaptive':()=>mc('Lesen · уточнение','paraphrase','В тексте: „Die Teilnahme ist kostenlos, eine Anmeldung ist jedoch erforderlich.“ Что верно?',['Можно прийти без регистрации','Участие бесплатное, но регистрация обязательна','Регистрация платная'],1,'analysis'),
analysis:()=>`<span class="eyebrow">Анализ</span><h1 class="h1">Первые сигналы собраны</h1>${card('Lesen',status('Lesen'))}${card('Hören',status('Hören'))}${card('Schreiben',S.writing.length?'Есть образец ответа':'Недостаточно данных')}${card('Sprechen',S.speaking.length?'Есть запись попытки':'Недостаточно данных')}${btn('Открыть карту навыков','skill-map')}`,
'skill-map':()=>`<span class="eyebrow">Микронавыки</span><h1 class="h1">Не просто четыре процента</h1>${card('Перефразирование',status('Lesen'))}${card('Цель / результат',status('Lesen'))}${card('Distraktoren Hören',status('Hören'))}${card('Выполнение пунктов Schreiben',S.writing.length?'Нужно накопить перепроверки':'Нет данных')}${btn('Построить маршрут','personal-route')}`,
'personal-route':()=>`<span class="eyebrow">Персональный маршрут</span><h1 class="h1">Твой первый маршрут</h1>${card('1. Lesen · перефразирование','Короткая серия + перепроверка','soft')}${card('2. Schreiben · выполнение пунктов','Сначала структура, затем качество')}${card('3. Hören · смысл против совпадения слов','Без зачёта demo-TTS в readiness')}${btn('Перейти в приложение','home')}`,
home:()=>`<span class="eyebrow">${esc(S.name||'OTTO B1')}</span><h1 class="h1">Сегодня работаем точечно</h1><p class="sub">${S.examDate?'Экзамен: '+esc(S.examDate):'Дата экзамена не указана'}</p>${modules()}${card('Режим дня',S.daily+' минут')}${btn('Начать занятие','today')}${btn('Индекс готовности','readiness','secondary')}`,
route:()=>`<span class="eyebrow">Маршрут</span><h1 class="h1">Что идёт следующим</h1>${card('Сейчас','Lesen: paraphrase → проверка')}${card('После','Schreiben: пункты задачи')}${card('Затем','Повторная проверка слабого микронавыка')}${btn('Выбрать время','time')}`,
today:()=>`<span class="eyebrow">Сегодня</span><h1 class="h1">Занятие на ${S.daily} минут</h1>${card('Разогрев','1 короткий Lesen')}${card('Основной блок','слабый микронавык')}${card('Закрытие','перепроверка старой ошибки')}${btn('Начать','lesen')}`,
time:()=>`<span class="eyebrow">Темп</span><h1 class="h1">Сколько времени есть?</h1><div class="grid">${[10,25,45].map(n=>`<button class="module" onclick="S.daily=${n};persist();go('route')"><b>${n} минут</b><small>${n===10?'минимум':n===25?'основной режим':'глубокая сессия'}</small></button>`).join('')}</div>`,
lesen:()=>mc('Lesen','paraphrase','„Obwohl das Café klein ist, findet man fast immer einen freien Platz.“ Что соответствует тексту?',['В кафе всегда много людей','Несмотря на размер, место обычно есть','Кафе закрыто'],1,'wrong','route'),
hoeren:()=>`<span class="eyebrow">Hören</span><h1 class="h1">Слушаем смысл</h1><button class="btn secondary" onclick="speak('Der Termin am Dienstag muss leider verschoben werden. Wir treffen uns stattdessen am Donnerstag um fünfzehn Uhr.')">▶ Воспроизвести</button><p><b>Когда состоится встреча?</b></p>${opts(['Во вторник','В четверг в 15:00','В пятницу'])}<button class="btn primary" onclick="submitMC('Hören','time_detail',1,'route')">Ответить</button><div class="notice">Demo-TTS не влияет на официальный readiness.</div>`,
schreiben:()=>`<span class="eyebrow">Schreiben</span><h1 class="h1">Ответь на задачу</h1><p class="sub">Напиши знакомому: почему не пришёл, что произошло, предложи новую встречу.</p><textarea id="w" class="field" rows="8"></textarea><button class="btn primary" onclick="submitWriting('writing-review')">Разобрать</button>`,
'writing-review':()=>`<span class="eyebrow">Формативный разбор</span><h1 class="h1">Schreiben</h1>${card('Что проверено','наличие немецкого текста, объём и базовая релевантность','ok')}${card('Что не выдаём за Goethe-балл','Без экспертной/AI-проверки не ставим официальный процент.')}${btn('К маршруту','route')}`,
sprechen:()=>`<span class="eyebrow">Sprechen</span><h1 class="h1">Говори, а не читай</h1>${card('Задание','Расскажи о полезной привычке и объясни, почему она важна.')}${btn('Записать ответ','record')}`,
record:()=>`<span class="eyebrow">Запись</span><h1 class="h1">Говори 30–60 секунд</h1><button id="rec" class="record" onclick="toggleRec()">●</button><div id="recmsg" class="notice">Микрофон ещё не запущен.</div><button class="btn primary" onclick="saveSpeaking()">Сохранить попытку</button>`,
'speaking-review':()=>`<span class="eyebrow">Sprechen</span><h1 class="h1">Попытка сохранена</h1>${card('Доказательство','Запись выполнена. Автоматический процент произношения пока не рассчитывается.','ok')}${btn('Продолжить диагностику',S.diag.speakingDone?'diag-adaptive':'route')}`,
strategy:()=>`<span class="eyebrow">Стратегия Отто</span><h1 class="h1">Сначала вопрос — потом текст</h1>${card('1','Пойми, какую информацию ищешь')}${card('2','Не цепляйся за одно одинаковое слово')}${card('3','Проверяй отрицания, цель и результат')}${btn('Применить','lesen')}`,
hint:()=>`<span class="eyebrow">Совет Отто</span><h1 class="h1">Ищи смысловой эквивалент</h1><div class="notice">На B1 правильный ответ часто перефразирует текст, а Distraktor повторяет знакомые слова.</div>${btn('Вернуться','lesen')}`,
wrong:()=>`<span class="eyebrow">Ошибка</span><h1 class="h1">Не просто «неверно»</h1>${card('Тип ошибки','Ты выбрал совпадение по словам вместо смысла.','bad')}${btn('Почему так произошло','why')}${btn('Попробовать ещё раз','lesen','secondary')}`,
why:()=>`<span class="eyebrow">Причина</span><h1 class="h1">Ловушка перефразирования</h1><p class="sub">Экзамен проверяет понимание связи между фразами. Совпавшее слово не гарантирует правильный вариант.</p>${btn('Стратегия','strategy')}`,
errors:()=>`<span class="eyebrow">Память ошибок</span><h1 class="h1">Мои ошибки</h1>${S.errors.length?S.errors.slice(-8).reverse().map(e=>card(e.module,e.skill,'bad')).join(''):card('Пока пусто','Ошибки появятся после тренировок.')}${btn('Тренировать слабое','lesen')}`,
progress:()=>`<span class="eyebrow">Прогресс</span><h1 class="h1">Доказательства, а не красивый процент</h1>${['Lesen','Hören'].map(m=>card(m,status(m)+' · попыток '+evidence(m))).join('')}${card('Schreiben','образцов: '+S.writing.length)}${card('Sprechen','записей: '+S.speaking.length)}${btn('Readiness','readiness')}`,
exam:()=>`<span class="eyebrow">Mini-exam QA</span><h1 class="h1">Без подсказок</h1><p class="sub">Пока это вертикальный срез, не полный Goethe-пробник.</p>${mcInner('Что означает „Die Veranstaltung fällt aus“?',['Мероприятие переносится','Мероприятие отменяется','Мероприятие начинается'],1)}<button class="btn primary" onclick="S.exam.push({ok:selected===1});recordAttempt('Lesen','exam',selected===1);persist();go('exam-result')">Завершить mini-exam</button>`,
'exam-result':()=>`<span class="eyebrow">Результат</span><h1 class="h1">Mini-exam QA</h1><div class="big">${S.exam.length&&S.exam.at(-1).ok?'1/1':'0/1'}</div><p class="sub">Один вопрос не превращается в «готовность B1».</p>${btn('Обновить маршрут','reroute')}`,
readiness:()=>`<span class="eyebrow">Readiness</span><h1 class="h1">Готовность по модулям</h1>${['Lesen','Hören'].map(m=>card(m,status(m))).join('')}${card('Schreiben',S.writing.length>=2?'Есть несколько образцов':'Недостаточно данных')}${card('Sprechen',S.speaking.length>=2?'Есть несколько записей':'Недостаточно данных')}<div class="notice">Система не обещает «вы точно сдадите». Для устойчивого вывода нужны повторные доказательства и полноценные пробные модули.</div>${btn('Mini-exam','exam')}`,
reroute:()=>`<span class="eyebrow">Пересчёт</span><h1 class="h1">Маршрут изменён</h1>${card('Усилено','микронавыки с повторными ошибками','warn')}${card('Сокращено','то, что подтверждено повторными успешными попытками','ok')}${btn('Новый маршрут','route')}`,
states:()=>`<span class="eyebrow">System states</span><h1 class="h1">Состояния интерфейса</h1>${card('Нет данных','Показываем «недостаточно данных», а не выдуманный процент.')}${card('Микрофон запрещён','Пользователь получает понятное сообщение и может продолжить.')}${card('Storage недоступен','Используется память текущей сессии.')}`};
function opts(a){return `<div>${a.map((x,i)=>`<button class="option ${selected===i?'sel':''}" onclick="selected=${i};render()">${esc(x)}</button>`).join('')}</div>`}function mcInner(q,a,c){return `<p><b>${q}</b></p>${opts(a)}`}function mc(mod,skill,q,a,c,next,wrong=''){return `<span class="eyebrow">${mod}</span><h1 class="h1">${q}</h1>${opts(a)}<button class="btn primary" onclick="submitMC('${mod}','${skill}',${c},'${next}','${wrong}')">Ответить</button><button class="btn secondary" onclick="go('hint')">Совет Отто</button>`}function submitMC(mod,skill,c,next,wrong=''){if(selected===null)return alert('Выбери ответ');let ok=selected===c;recordAttempt(mod,skill,ok);selected=null;go(ok?next:(wrong||next))}
function submitWriting(next){let t=(by('w')?.value||'').trim();let german=/\b(ich|wir|der|die|das|und|aber|weil|dass|kann|möchte|leider|treffen|Termin)\b/i.test(t);if(t.length<25||!german)return alert('Нужен осмысленный ответ на немецком, не короче 25 символов.');S.writing.push({text:t,at:Date.now()});S.diag.writingDone=true;persist();go(next)}function speak(t){if(!('speechSynthesis'in window))return alert('Озвучка браузером недоступна.');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.9;speechSynthesis.speak(u)}async function toggleRec(){let b=by('rec'),m=by('recmsg');if(rec){rec.stop();rec.stream?.getTracks().forEach(t=>t.stop());rec=null;b.classList.remove('on');m.textContent='Запись остановлена. Можно сохранить попытку.';return}try{let st=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(st);rec.stream=st;rec.ondataavailable=e=>chunks.push(e.data);rec.start();b.classList.add('on');m.textContent='Идёт запись… нажми ещё раз, чтобы остановить.'}catch(e){m.textContent='Нет доступа к микрофону: '+e.message}}function saveSpeaking(){if(rec){rec.stop();rec.stream?.getTracks().forEach(t=>t.stop());rec=null}S.speaking.push({at:Date.now(),bytes:chunks.reduce((n,b)=>n+b.size,0)});S.diag.speakingDone=true;persist();go('speaking-review')}
function render(){let r=current();if(!TITLES[r])r='home';by('barTitle').textContent=TITLES[r];by('screen').innerHTML=(R[r]||R.home)();let onboarding=['splash','intro','register','goal','diag-start','diag-reading','diag-listening','diag-writing','diag-speaking','diag-adaptive','analysis'];by('nav').classList.toggle('hide',onboarding.includes(r));by('back').style.visibility=r==='splash'?'hidden':'visible';selected=null}by('back').onclick=back;by('mapItems').innerHTML=SCREENS.map(([r,t],i)=>`<button onclick="toggleMap();go('${r}')">${i+1}. ${t}</button>`).join('');window.addEventListener('hashchange',render);window.addEventListener('error',e=>{console.error(e);by('screen').innerHTML=`<div class="card bad"><b>Техническая ошибка</b><p>${esc(e.message)}</p></div>`});if(!location.hash)location.hash='#/splash';render();
</script></body></html>
