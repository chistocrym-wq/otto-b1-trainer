<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0c2745" />
  <meta name="description" content="OTTO B1 Preview — персональная подготовка к Goethe-Zertifikat B1" />
  <title>OTTO B1 — Preview 1</title>
  <style>
:root{
  --ink:#10283f;--muted:#68798b;--line:#dbe5ef;--bg:#eef3f8;--card:#fff;
  --blue:#1f63d5;--blue2:#174d9d;--soft:#eff5ff;--good:#176c4a;--goodbg:#eaf7f0;
  --warn:#9a5b08;--warnbg:#fff6df;--bad:#9e3d39;--badbg:#fff0ef;--shadow:0 18px 50px rgba(17,42,70,.10);
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}
*{box-sizing:border-box}html{background:var(--bg);color:var(--ink)}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#fff 0,#f7f9fc 35%,var(--bg) 100%)}button,input,textarea{font:inherit}.app-shell{max-width:980px;min-height:100vh;margin:0 auto;background:rgba(255,255,255,.86);box-shadow:0 0 80px rgba(24,51,79,.08);position:relative}.topbar{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.92);backdrop-filter:blur(16px);position:sticky;top:0;z-index:20}.brand{border:0;background:none;display:flex;align-items:baseline;gap:8px;color:var(--ink);cursor:pointer}.brand-mark{font-family:Georgia,serif;font-size:28px;font-weight:800;letter-spacing:-1px;border-bottom:3px solid var(--blue);line-height:1}.brand-level{font-size:13px;font-weight:900;letter-spacing:.13em;color:var(--blue)}.topbar-actions{display:flex;gap:8px}.icon-btn{width:40px;height:40px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);font-weight:900;cursor:pointer}.screen{padding:34px 34px 130px;min-height:calc(100vh - 68px)}.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:34px;align-items:center;min-height:620px}.hero-copy{padding:28px 0}.kicker{display:inline-flex;gap:8px;align-items:center;font-size:12px;font-weight:900;letter-spacing:.11em;text-transform:uppercase;color:var(--blue);margin-bottom:14px}.h1{font-family:Georgia,serif;font-size:clamp(34px,5vw,60px);line-height:1.02;letter-spacing:-.035em;margin:0 0 18px}.h2{font-family:Georgia,serif;font-size:clamp(28px,4vw,42px);line-height:1.08;margin:0 0 12px}.lead{font-size:18px;line-height:1.65;color:var(--muted);max-width:700px}.hero-otto{background:linear-gradient(160deg,#f9fbff,#e9f1fb);border:1px solid var(--line);border-radius:32px;min-height:470px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative}.hero-otto:after{content:"";position:absolute;inset:auto 12% 6% 12%;height:22px;background:rgba(14,39,70,.13);filter:blur(16px);border-radius:50%}.hero-otto img{width:min(92%,420px);max-height:500px;object-fit:contain;z-index:1}.btn{border:0;border-radius:15px;padding:14px 18px;font-weight:850;cursor:pointer;transition:.15s transform,.15s box-shadow;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:hover{transform:translateY(-1px)}.btn.primary{background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;box-shadow:0 10px 24px rgba(31,99,213,.23)}.btn.secondary{background:var(--soft);color:var(--blue2);border:1px solid #d9e7fb}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:var(--badbg);color:var(--bad);border:1px solid #f1d5d2}.button-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.stack{display:grid;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 8px 30px rgba(15,42,70,.04)}.card.soft{background:linear-gradient(145deg,#f7faff,#eef5ff)}.card.good{background:var(--goodbg);border-color:#cdebdc}.card.warn{background:var(--warnbg);border-color:#f0dfb0}.card.bad{background:var(--badbg);border-color:#efd2cf}.card-title{font-size:16px;font-weight:900;margin-bottom:6px}.muted{color:var(--muted);line-height:1.55}.small{font-size:12px;color:var(--muted)}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.module-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}.module-card b{display:block;margin-bottom:7px}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:900;background:#edf3fb;color:#395c80}.pill.good{background:var(--goodbg);color:var(--good)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}.form-grid{display:grid;gap:16px;max-width:650px}.field{width:100%;border:1px solid #cfdae7;background:#fff;border-radius:15px;padding:14px 15px;color:var(--ink);outline:none}.field:focus{border-color:#79a4e9;box-shadow:0 0 0 4px rgba(56,118,218,.12)}textarea.field{resize:vertical;line-height:1.55}.choice-grid{display:grid;gap:10px;margin:18px 0}.choice{width:100%;text-align:left;border:1px solid #d3deea;background:#fff;border-radius:16px;padding:14px 15px;cursor:pointer;color:var(--ink);font-weight:720}.choice:hover{border-color:#94b5e6;background:#f7faff}.choice.selected{border-color:var(--blue);background:#edf4ff;box-shadow:0 0 0 2px rgba(31,99,213,.07)}.choice:disabled{opacity:.65;cursor:not-allowed}.task-text{font-size:17px;line-height:1.72;background:#f8fafc;border:1px solid var(--line);border-radius:20px;padding:20px;margin:16px 0}.task-tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{border:1px solid #d4dfeb;background:#fff;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:850;color:#375b7d;cursor:pointer}.notice{border-left:4px solid var(--blue);background:#f2f6fb;border-radius:0 16px 16px 0;padding:14px 16px;color:#486174;line-height:1.55;margin:14px 0}.progress-line{height:8px;background:#e8eef5;border-radius:999px;overflow:hidden;margin:12px 0 22px}.progress-line i{display:block;height:100%;background:linear-gradient(90deg,var(--blue2),var(--blue));border-radius:999px}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--blue);display:block;margin-bottom:8px}.status-row{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.status-row p{margin:6px 0 0}.route-item{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:start}.route-number{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#edf4ff;color:var(--blue);font-weight:950}.evidence-bar{display:flex;gap:5px;margin-top:10px}.evidence-bar span{height:5px;flex:1;border-radius:999px;background:#e5ebf2}.evidence-bar span.on{background:#5f8fd9}.bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(980px,100%);height:76px;background:rgba(255,255,255,.94);border-top:1px solid var(--line);display:flex;justify-content:center;gap:6px;z-index:18;backdrop-filter:blur(16px);padding-bottom:env(safe-area-inset-bottom)}.bottom-nav button{flex:1;max-width:160px;border:0;background:none;color:#6f8193;display:grid;place-items:center;align-content:center;gap:3px;cursor:pointer}.bottom-nav button span{font-size:20px}.bottom-nav button small{font-size:11px;font-weight:800}.bottom-nav button.active{color:var(--blue)}.otto-fab{position:fixed;right:max(18px,calc((100vw - 980px)/2 + 18px));bottom:92px;border:0;background:#0c315b;color:#fff;border-radius:999px;padding:7px 13px 7px 7px;box-shadow:0 12px 28px rgba(10,47,89,.25);display:flex;align-items:center;gap:8px;font-weight:850;z-index:19;cursor:pointer}.otto-fab img{width:42px;height:42px;border-radius:50%;object-fit:cover;object-position:50% 18%;background:#fff}.modal-backdrop{position:fixed;inset:0;background:rgba(7,20,34,.48);z-index:50;display:grid;place-items:center;padding:18px}.modal{width:min(620px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:26px;border:1px solid var(--line);box-shadow:var(--shadow);padding:24px}.modal-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:14px}.close{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:12px;cursor:pointer}.checklist{display:grid;gap:9px}.check-item{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:11px}.check-dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#eef2f6;color:#8290a0;font-size:12px;font-weight:900;flex:0 0 auto}.check-item.done .check-dot{background:var(--goodbg);color:var(--good)}.speaker{display:flex;align-items:center;gap:12px;background:#f7f9fc;border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}.speaker-avatar{width:48px;height:48px;border-radius:50%;overflow:hidden;background:#fff;flex:0 0 auto}.speaker-avatar img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}.bubble{background:#eff5ff;border-radius:18px 18px 18px 4px;padding:14px 16px;line-height:1.55}.record-box{border:1px dashed #a9bbcd;border-radius:18px;padding:16px;text-align:center}.record-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#aeb8c2;margin-right:7px}.recording .record-dot{background:#d5443f;box-shadow:0 0 0 6px rgba(213,68,63,.12)}.timer{font-variant-numeric:tabular-nums;font-size:30px;font-weight:950;letter-spacing:.04em}.summary-stat{font-size:30px;font-weight:950}.divider{height:1px;background:var(--line);margin:18px 0}.hidden{display:none!important}
@media(max-width:720px){.screen{padding:26px 18px 126px}.hero{grid-template-columns:1fr;min-height:auto}.hero-otto{min-height:330px;order:-1}.hero-otto img{max-height:350px}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.route-item{grid-template-columns:40px 1fr}.route-item>.pill{grid-column:2}.otto-fab span{display:none}.otto-fab{padding:6px;right:14px}.topbar{padding:0 16px}.h1{font-size:40px}}
@media(max-width:420px){.hero-otto{min-height:290px}.grid4{grid-template-columns:1fr 1fr}.status-row{display:grid}.button-row .btn{width:100%}.module-card{padding:14px}.screen{padding-left:14px;padding-right:14px}}

</style>

<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="brand" data-nav="home" aria-label="На главную">
        <span class="brand-mark">Otto</span><span class="brand-level">B1</span>
      </button>
      <div class="topbar-actions">
        <button id="scenarioButton" class="icon-btn" title="Сценарий проверки" aria-label="Сценарий проверки">✓</button>
        <button id="resetButton" class="icon-btn" title="Сбросить превью" aria-label="Сбросить превью">↻</button>
      </div>
    </header>

    <main id="screen" class="screen" aria-live="polite"></main>

    <nav id="bottomNav" class="bottom-nav" aria-label="Основная навигация">
      <button data-nav="home"><span>⌂</span><small>Сегодня</small></button>
      <button data-nav="route"><span>↗</span><small>Маршрут</small></button>
      <button data-nav="errors"><span>!</span><small>Ошибки</small></button>
      <button data-nav="progress"><span>◔</span><small>Прогресс</small></button>
    </nav>

    <button id="ottoFab" class="otto-fab" aria-label="Открыть Otto Personal">
      <img id="ottoFabImg" alt="Otto" />
      <span>Спросить Otto</span>
    </button>

    <div id="modalRoot"></div>
  </div>

  checkpointHoeren:{module:'Hören',skill:'detail_change',audioText:'Die Führung beginnt heute ausnahmsweise um zehn Uhr fünfzehn. Bitte kommen Sie zehn Minuten früher zum Haupteingang.',prompt:'Die Führung beginnt heute um 10:15 Uhr.',options:['Richtig','Falsch'],correct:0},
  examLesen:{module:'Lesen',skill:'detail',text:'Wegen einer technischen Störung beginnt der Vortrag heute erst um 19 Uhr statt um 18 Uhr. Der Saal öffnet wie geplant um 17:30.',prompt:'Der Vortrag beginnt heute später als ursprünglich geplant.',options:['Richtig','Falsch'],correct:0},
  examHoeren:{module:'Hören',skill:'change_detection',audioText:'Der Bus nach Bonn fährt heute nicht von Steig drei, sondern von Steig fünf. Die Abfahrtszeit um vierzehn Uhr zwanzig bleibt unverändert.',prompt:'Nur der Abfahrtssteig wurde geändert.',options:['Richtig','Falsch'],correct:0}
};

const CHECKS=[
  ['onboarding','Вход и настройки'],['diagnostic','Диагностика'],['report','Gap report'],['route','Персональный маршрут'],
  ['daily','Daily session'],['repair','Ошибка → self-correction → transfer'],['speaking','Sprechen с Otto'],
  ['weekly','Weekly checkpoint'],['exam','Exam-mode proof'],['otto','Otto Personal shell']
];

function freshState(){
  return {
    version:1,name:'',examDate:'',dailyMinutes:25,goal:'Сдать Goethe-Zertifikat B1',route:'welcome',
    diagnostic:{index:0,closed:[],writing:null,speaking:null,completed:false,audioPlays:{}},
    evidence:[],errors:[],reviews:[],mastery:{},priorities:[],visited:[],
    daily:{active:false,step:'intro',sessionId:null},
    ui:{selected:null,translation:{},strategy:{},scenarioOpen:false,ottoOpen:false},
    speaking:{turn:0,history:[],recordings:0},weekly:{answers:[],completed:false},
    exam:{index:0,answers:[],startedAt:null,endsAt:null,completed:false,audioPlays:{}},createdAt:now(),updatedAt:now()
  };
}

let S=load();
let mediaRecorder=null, mediaChunks=[];
let examTimer=null;

function load(){try{return Object.assign(freshState(),JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'));}catch{return freshState();}}
function save(){S.updatedAt=now();localStorage.setItem(STORAGE_KEY,JSON.stringify(S));}
function reset(){localStorage.removeItem(STORAGE_KEY);S=freshState();location.hash='#welcome';render();}
function visit(key){if(!S.visited.includes(key)){S.visited.push(key);save();}}
function go(route){S.route=route;S.ui.selected=null;save();location.hash='#'+route;render();}
function currentRoute(){return (location.hash||'#welcome').slice(1);}
function card(title,body,kind=''){return `<div class="card ${kind}"><div class="card-title">${esc(title)}</div><div class="muted">${body}</div></div>`;}
function pill(text,kind=''){return `<span class="pill ${kind}">${esc(text)}</span>`;}
function cta(label,action,kind='primary'){return `<button class="btn ${kind}" onclick="${action}">${label}</button>`;}

function recordEvidence(module,skill,outcome,mode,extra={}){
  S.evidence.push({id:uid('ev'),module,skill,outcome,mode,assisted:!!extra.assisted,audio:!!extra.audio,at:now(),...extra});
  recompute();save();
}
function addError(taskId,selected){
  const t=TASKS[taskId];
  let e=S.errors.find(x=>x.skill===t.skill&&x.status!=='resolved');
  if(e){e.recurrence++;e.lastSeen=now();e.sourceTask=taskId;e.selected=selected;e.status='active';}
  else S.errors.push(e={id:uid('err'),module:t.module,skill:t.skill,sourceTask:taskId,selected,correct:t.correct,reason:t.distractor||t.evidence,status:'active',recurrence:0,selfCorrection:false,transfer:false,lastSeen:now(),nextDue:null});
  save();return e;
}
function recompute(){
  const skills={};
  for(const e of S.evidence){
    const k=e.skill; if(!skills[k]) skills[k]={attempts:0,independent:0,correct:0,assisted:0,last:null};
    skills[k].attempts++; if(e.assisted) skills[k].assisted++; else skills[k].independent++;
    if(e.outcome==='success')skills[k].correct++; skills[k].last=e.at;
  }
  for(const [k,x] of Object.entries(skills)){
    let state='introduced';
    if(x.independent===0)state='guided';
    else if(x.independent===1)state='independent';
    else if(x.correct/x.attempts<.55)state='unstable';
    else if(x.independent>=3&&x.correct/x.attempts>=.8)state='stable';
    S.mastery[k]={...x,state};
  }
  buildPriorities();
}
function buildPriorities(){
  const items=[];
  const activeErrors=S.errors.filter(e=>e.status!=='resolved');
  for(const e of activeErrors)items.push({module:e.module,skill:e.skill,label:skillLabel(e.skill),reason:e.recurrence?'Ошибка вернулась — ставим выше в маршрут.':'Есть конкретная ошибка, которую нужно довести до transfer-проверки.',score:100+e.recurrence*20});
  const diagByModule=MODULES.map(m=>[m,S.evidence.filter(e=>e.module===m)]);
  for(const [m,evs] of diagByModule){
    if(!evs.length)items.push({module:m,skill:'evidence_gap',label:'Недостаточно данных',reason:'Нужно получить независимое доказательство по модулю.',score:72});
    else if(evs.some(e=>e.outcome==='failure'))items.push({module:m,skill:'module_risk',label:'Нужна перепроверка',reason:'Есть неуспешная попытка или неполное выполнение.',score:80});
    else if(evs.filter(e=>!e.assisted).length<2)items.push({module:m,skill:'confirm',label:'Нужно подтверждение',reason:'Одной удачной попытки недостаточно для устойчивого вывода.',score:60});
  }
  const unique=[]; const seen=new Set();
  items.sort((a,b)=>b.score-a.score);
  for(const x of items){const k=x.module+'|'+x.skill;if(!seen.has(k)){seen.add(k);unique.push(x);}}
  S.priorities=unique.slice(0,6);
}
function skillLabel(k){return ({paraphrase:'Перефразирование',negation_limitation:'Отрицание и ограничение',detail_change:'Точная деталь / изменение',change_detection:'Изменение договорённости',word_order:'Порядок слов',vocab_context:'Контекстная лексика'}[k]||k);}
function moduleSummary(module){
  const ev=S.evidence.filter(e=>e.module===module);
  if(!ev.length)return{label:'Недостаточно данных',kind:'warn',detail:'Нужны реальные попытки.'};
  if(ev.some(e=>e.outcome==='failure'))return{label:'Есть риск',kind:'bad',detail:'Есть ошибка, которая должна пройти repair и transfer.'};
  const ind=ev.filter(e=>!e.assisted).length;
  if(ind<2)return{label:'Нужно подтверждение',kind:'warn',detail:'Сигнал есть, но доказательств пока мало.'};
  return{label:'Есть подтверждение',kind:'good',detail:'Есть несколько независимых успешных попыток. Это не официальный Goethe score.'};
}
function zone(){
  const base=S.evidence.filter(e=>e.module==='Basis');
  if(base.length<2)return 'Недостаточно данных';
  const ok=base.filter(e=>e.outcome==='success').length;
  return ok===2?'Примерно A2+/B1-вход: нужен экзаменационный профиль':ok===1?'Примерно A2: есть языковой разрыв до уверенной B1-подготовки':'База пока ниже целевой зоны B1 — маршрут начнётся с предпосылок';
}

function render(){
  const route=currentRoute();S.route=route;
  const screen=$('#screen');
  const renderer=VIEWS[route]||VIEWS.welcome;
  screen.innerHTML=renderer();
  const onboarding=['welcome','setup','diagnostic','report'];
  $('#bottomNav').classList.toggle('hidden',onboarding.includes(route));
  $('#ottoFab').classList.toggle('hidden',route==='welcome'||route==='setup'||route==='diagnostic'||route==='exam');
  document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===route));
  if(route==='exam')startExamTicker();else stopExamTicker();
}

function welcome(){visit('onboarding');return `<section class="hero"><div class="hero-copy"><span class="kicker">Preview 1 · owner walkthrough</span><h1 class="h1">Готовимся именно к Goethe B1</h1><p class="lead">Otto сначала понимает вашу языковую базу и конкретные пробелы, а затем сам решает, что тренировать сегодня. Без псевдоточных процентов и без обещаний «вы точно сдадите».</p><div class="button-row">${cta('Начать превью','go(\'setup\')')}${cta('Открыть сценарий проверки','openScenario()','ghost')}</div><p class="small" style="margin-top:18px">Это новый Preview 1 с нуля. Данные хранятся только в localStorage этого браузера.</p></div><div class="hero-otto"><img src="${OTTO_SRC}" alt="Otto показывает важный момент"></div></section>`;}

function setup(){return `<span class="eyebrow">Первый вход</span><h1 class="h2">Настроим подготовку</h1><p class="lead">Дата и доступное время влияют на маршрут. Для превью достаточно заполнить имя и выбрать длительность.</p><div class="form-grid card"><label><b>Имя</b><input id="name" class="field" value="${esc(S.name)}" placeholder="Например, Анна"></label><label><b>Дата экзамена</b><input id="examDate" class="field" type="date" value="${esc(S.examDate)}"></label><div><b>Сколько времени обычно есть?</b><div class="button-row">${[10,25,45].map(n=>`<button class="btn ${S.dailyMinutes===n?'primary':'ghost'}" onclick="S.dailyMinutes=${n};save();render()">${n} минут</button>`).join('')}</div></div><label><b>Цель</b><input id="goal" class="field" value="${esc(S.goal)}"></label></div><div class="button-row">${cta('К диагностике','saveSetup()')}</div>`;}
function saveSetup(){S.name=$('#name').value.trim()||'Ученик';S.examDate=$('#examDate').value;S.goal=$('#goal').value.trim()||'Сдать Goethe-Zertifikat B1';save();go('diagnostic');}

const DIAG_STEPS=['vocab','grammar','lesen','hoeren','writing','speaking'];
function diagnostic(){visit('diagnostic');const i=S.diagnostic.index;const step=DIAG_STEPS[i];if(S.diagnostic.completed)return report();const pct=Math.round((i/DIAG_STEPS.length)*100);let body='';
  if(step==='vocab')body=mcTask('diagVocab','Контекстная лексика',`diagAnswer('diagVocab')`);
  if(step==='grammar')body=mcTask('diagGrammar','Языковая база · грамматика',`diagAnswer('diagGrammar')`);
  if(step==='lesen')body=mcTask('diagLesen','Lesen · exam-gap probe',`diagAnswer('diagLesen')`,true,true);
  if(step==='hoeren')body=audioTask('diagHoeren','Hören · detail probe',`diagAnswer('diagHoeren')`,true);
  if(step==='writing')body=writingDiagnostic();
  if(step==='speaking')body=speakingDiagnostic();
  return `<span class="eyebrow">Глубокая диагностика · шаг ${i+1} из ${DIAG_STEPS.length}</span><div class="progress-line"><i style="width:${pct}%"></i></div>${body}`;
}
function mcTask(id,title,submit,translation=false,strategy=false){const t=TASKS[id];return `<h1 class="h2">${esc(title)}</h1>${t.text?`<div class="task-text">${esc(t.text)}</div>`:''}${translation?taskTools(id,strategy):''}<p class="lead" style="font-size:17px"><b>${esc(t.prompt)}</b></p><div class="choice-grid">${t.options.map((x,i)=>`<button class="choice ${S.ui.selected===i?'selected':''}" onclick="S.ui.selected=${i};save();render()">${esc(x)}</button>`).join('')}</div>${cta('Продолжить',submit)}`;}
function taskTools(id,strategy=true){const t=TASKS[id],tr=!!S.ui.translation[id],st=!!S.ui.strategy[id];return `<div class="task-tools"><button class="chip" onclick="toggleTranslation('${id}')">👁 ${tr?'Скрыть перевод':'Перевод'}</button>${strategy?`<button class="chip" onclick="toggleStrategy('${id}')">☝ ${st?'Скрыть стратегию':'Стратегия'}</button>`:''}</div>${tr?`<div class="notice"><b>Перевод:</b> ${esc(t.translation||'Перевод доступен только для текстовой части задания.')}</div>`:''}${st?`<div class="notice"><b>Стратегия Otto:</b> сначала поймите, что именно утверждается в вопросе; затем ищите смысловой эквивалент, отрицание или изменение, а не одинаковое слово.</div>`:''}`;}
function toggleTranslation(id){S.ui.translation[id]=!S.ui.translation[id];save();render();}
function toggleStrategy(id){S.ui.strategy[id]=!S.ui.strategy[id];save();render();}
function audioTask(id,title,submit,training=false){const t=TASKS[id],plays=(S.diagnostic.audioPlays[id]||S.exam.audioPlays[id]||0);return `<h1 class="h2">${esc(title)}</h1><div class="speaker"><div class="speaker-avatar"><img src="${OTTO_SRC}" alt="Otto"></div><div><b>Аудио-задание</b><div class="small">Preview: немецкий текст озвучивается системным de-DE голосом браузера. В production здесь будет versioned audio.</div></div></div><button class="btn secondary" onclick="playTaskAudio('${id}')">▶ Воспроизвести${plays?` · прослушиваний ${plays}`:''}</button>${training?`<div class="task-tools"><button class="chip" onclick="toggleStrategy('${id}')">☝ ${S.ui.strategy[id]?'Скрыть стратегию':'Стратегия'}</button></div>${S.ui.strategy[id]?`<div class="notice">До прослушивания прочитайте вопрос. Не цепляйтесь за первое знакомое время или место — слушайте, не изменилась ли договорённость.</div>`:''}`:''}<p class="lead" style="font-size:17px"><b>${esc(t.prompt)}</b></p><div class="choice-grid">${t.options.map((x,i)=>`<button class="choice ${S.ui.selected===i?'selected':''}" onclick="S.ui.selected=${i};save();render()">${esc(x)}</button>`).join('')}</div>${cta('Продолжить',submit)}`;}
function playTaskAudio(id){const t=TASKS[id];if(!('speechSynthesis' in window)){alert('В этом браузере недоступна системная озвучка. Для превью можно продолжить, но Hören будет отмечен как недостаток audio evidence.');return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.audioText);u.lang='de-DE';u.rate=.88;speechSynthesis.speak(u);if(currentRoute()==='exam')S.exam.audioPlays[id]=(S.exam.audioPlays[id]||0)+1;else S.diagnostic.audioPlays[id]=(S.diagnostic.audioPlays[id]||0)+1;save();render();}
function diagAnswer(id){if(S.ui.selected==null)return alert('Выберите ответ.');const t=TASKS[id];const ok=S.ui.selected===t.correct;recordEvidence(t.module,t.skill,ok?'success':'failure','diagnostic',{taskId:id,selected:S.ui.selected,assisted:!!(S.ui.translation[id]||S.ui.strategy[id]),audio:!!t.audioText});S.diagnostic.closed.push({id,ok,at:now()});S.ui.selected=null;S.diagnostic.index++;if(S.diagnostic.index>=DIAG_STEPS.length){S.diagnostic.completed=true;recompute();save();go('report');}else{save();render();}}
function writingDiagnostic(){const prev=S.diagnostic.writing?.text||'';return `<h1 class="h2">Schreiben · productive sample</h1><p class="lead">Вы опоздали на встречу с другом. Напишите короткое e-mail: извинитесь, объясните причину и предложите новое время.</p><textarea id="diagWriting" class="field" rows="8" placeholder="Schreiben Sie auf Deutsch…">${esc(prev)}</textarea><div class="notice">В Preview мы проверяем только пригодность образца и коммуникативные функции. Это не AI-оценка и не Goethe score.</div>${cta('Сохранить образец','saveDiagnosticWriting()')}`;}
function analyzeWriting(text){const words=(text.match(/[A-Za-zÄÖÜäöüß]+/g)||[]).length;const german=(text.match(/\b(ich|wir|leider|weil|aber|kann|können|möchte|treffen|termin|uhr|entschuldig|vielleicht|würde)\b/gi)||[]).length;const funcs={apology:/entschuldig|leider/i.test(text),reason:/weil|wegen|da\b|denn/i.test(text),proposal:/könn|möcht|vielleicht|wie wäre|treffen/i.test(text)};return{words,german,funcs,covered:Object.values(funcs).filter(Boolean).length,valid:words>=20&&german>=2};}
function saveDiagnosticWriting(){const text=$('#diagWriting').value.trim();const a=analyzeWriting(text);if(!a.valid)return alert('Нужен осмысленный немецкий текст примерно от 20 слов, чтобы в превью появился evidence.');S.diagnostic.writing={text,analysis:a,at:now()};recordEvidence('Schreiben','task_fulfilment',a.covered>=2?'success':'failure','diagnostic',{taskId:'diagWriting',wordCount:a.words,functions:a.funcs});S.diagnostic.index++;save();render();}
function speakingDiagnostic(){return `<h1 class="h2">Sprechen · речевой образец</h1><p class="lead">Скажите 20–40 секунд о том, как вы обычно проводите выходные. В Preview запись служит доказательством попытки, но произношение и уровень речи без отдельного анализа не оцениваются.</p><div id="recordBox" class="record-box ${mediaRecorder&&mediaRecorder.state==='recording'?'recording':''}"><p><span class="record-dot"></span><b>${mediaRecorder&&mediaRecorder.state==='recording'?'Идёт запись…':'Микрофон готов'}</b></p><div class="button-row" style="justify-content:center"><button class="btn secondary" onclick="toggleRecording('diagnostic')">${mediaRecorder&&mediaRecorder.state==='recording'?'Остановить':'🎙 Записать'}</button></div></div><div class="button-row">${cta('Сохранить и завершить диагностику','finishSpeakingDiagnostic()')}${cta('Продолжить без записи','skipSpeakingDiagnostic()','ghost')}</div>`;}
async function toggleRecording(context){if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.stop();mediaRecorder.stream.getTracks().forEach(t=>t.stop());render();return;}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});mediaChunks=[];mediaRecorder=new MediaRecorder(stream);mediaRecorder.stream=stream;mediaRecorder.ondataavailable=e=>{if(e.data.size)mediaChunks.push(e.data)};mediaRecorder.onstop=()=>{const bytes=mediaChunks.reduce((n,b)=>n+b.size,0);if(context==='diagnostic')S.diagnostic.speaking={recorded:bytes>0,bytes,at:now()};else{S.speaking.recordings+=(bytes>0?1:0);}save();mediaRecorder=null;render();};mediaRecorder.start();render();}catch(e){alert('Нет доступа к микрофону: '+e.message);}}
function finishSpeakingDiagnostic(){if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.stop();mediaRecorder.stream.getTracks().forEach(t=>t.stop());setTimeout(finishSpeakingDiagnostic,250);return;}const rec=S.diagnostic.speaking;recordEvidence('Sprechen','free_sample',rec?.recorded?'success':'unknown','diagnostic',{taskId:'diagSpeaking',audio:!!rec?.recorded,unscored:true});S.diagnostic.index++;S.diagnostic.completed=true;recompute();save();go('report');}
function skipSpeakingDiagnostic(){S.diagnostic.speaking={recorded:false,bytes:0,at:now()};recordEvidence('Sprechen','free_sample','unknown','diagnostic',{taskId:'diagSpeaking',audio:false,unscored:true});S.diagnostic.index++;S.diagnostic.completed=true;recompute();save();go('report');}

function report(){visit('report');recompute();return `<span class="eyebrow">Диагностический отчёт</span><h1 class="h2">Что уже видно — и чего пока не видно</h1>${card('Текущая языковая зона',esc(zone()),'soft')}<div class="grid4" style="margin:14px 0">${MODULES.map(m=>{const x=moduleSummary(m);return `<div class="module-card"><b>${m}</b>${pill(x.label,x.kind)}<p class="small">${esc(x.detail)}</p></div>`}).join('')}</div>${card('Важно','Это предварительный профиль. Otto не превращает несколько ответов в «процент готовности» и не обещает сдачу.','warn')}<h3>Ближайшие приоритеты</h3><div class="stack">${S.priorities.slice(0,3).map((x,i)=>routeItem(x,i)).join('')}</div><div class="button-row">${cta('Открыть мой маршрут','go(\'route\')')}</div>`;}
function routeItem(x,i){return `<div class="card route-item"><div class="route-number">${i+1}</div><div><b>${esc(x.module)} · ${esc(x.label)}</b><p class="muted">${esc(x.reason)}</p></div>${pill('в фокусе')}</div>`;}
function route(){visit('route');recompute();return `<span class="eyebrow">Моя подготовка</span><h1 class="h2">Персональный маршрут</h1><p class="lead">Otto выбирает приоритеты из ваших evidence, ошибок и недостатка данных — не из статического курса.</p><div class="stack">${S.priorities.slice(0,4).map((x,i)=>routeItem(x,i)).join('')||card('Маршрут строится','Нужна диагностика.','warn')}</div>${card('Длительность сегодня',`Выбрано <b>${S.dailyMinutes} минут</b>. В полном продукте 10/25/45 минут реально меняют состав сессии; в Preview меняется объём и пояснение маршрута.`,'soft')}<div class="button-row">${cta('Начать сегодняшнюю сессию','startDaily()')}${cta('Вернуться к отчёту','go(\'report\')','ghost')}</div>`;}
function startDaily(){visit('daily');S.daily={active:true,step:'lesen',sessionId:uid('session')};S.speaking={turn:0,history:[],recordings:0};save();go('daily');}
function whyNow(){const p=S.priorities[0];return p?`${p.module}: ${p.reason}`:'Нужен новый независимый evidence по Goethe B1.';}
function daily(){visit('daily');const step=S.daily.step||'lesen';if(step==='lesen')return dailyLesen();if(step==='hoeren')return dailyHoeren();if(step==='writing')return dailyWriting();if(step==='speaking')return dailySpeaking();if(step==='summary')return dailySummary();return dailyLesen();}
function dailyHeader(label){return `<span class="eyebrow">Сегодня · ${S.dailyMinutes} минут · ${label}</span>${card('Почему сейчас',esc(whyNow()),'soft')}`;}
function dailyLesen(){return `${dailyHeader('главный блок')}<h1 class="h2">Lesen · Training</h1>${mcTask('trainLesen','Отрицание и изменение смысла',`submitDailyLesen()`,true,true)}`;}
function submitDailyLesen(){if(S.ui.selected==null)return alert('Выберите ответ.');const t=TASKS.trainLesen,ok=S.ui.selected===t.correct,assisted=!!(S.ui.translation.trainLesen||S.ui.strategy.trainLesen);recordEvidence('Lesen',t.skill,ok?'success':'failure','training',{taskId:'trainLesen',selected:S.ui.selected,assisted});if(!ok){const e=addError('trainLesen',S.ui.selected);S.daily.activeError=e.id;S.ui.selected=null;visit('repair');save();go('repair');}else{S.ui.selected=null;S.daily.step='hoeren';save();render();}}
function repair(){visit('repair');const e=S.errors.find(x=>x.id===S.daily.activeError)||S.errors.find(x=>x.status!=='resolved');if(!e)return `<h1 class="h2">Активной ошибки нет</h1>${cta('Продолжить','continueAfterRepair()')}`;const t=TASKS[e.sourceTask];if(!e.explained)return `<span class="eyebrow">Ошибка → обучение</span><h1 class="h2">Не просто «неверно»</h1>${card('Что произошло',esc(t.distractor||e.reason),'bad')}${card('Evidence в тексте',`<b>${esc(t.evidence)}</b>`,'good')}${card('Как избежать на экзамене','Отделяйте первоначальный план от финального решения. Маркеры aber, erst, nicht, sondern часто меняют смысл.','soft')}<div class="button-row">${cta('Исправить самому','startSelfCorrection()')}</div>`;
  if(e.explained&&!e.selfCorrection)return `<span class="eyebrow">Self-correction</span><h1 class="h2">Теперь исправьте сами</h1><div class="task-text">${esc(t.text)}</div><p><b>${esc(t.prompt)}</b></p><div class="choice-grid">${t.options.map((x,i)=>`<button class="choice ${S.ui.selected===i?'selected':''}" onclick="S.ui.selected=${i};save();render()">${esc(x)}</button>`).join('')}</div>${cta('Проверить исправление','submitSelfCorrection()')}`;
  if(e.selfCorrection&&!e.transfer)return `<span class="eyebrow">Transfer-проверка</span><h1 class="h2">Тот же навык — новый материал</h1><div class="notice">Здесь перевод и стратегия намеренно недоступны: проверяем перенос навыка на новый контекст.</div><div class="task-text">${esc(TASKS.transferLesen.text)}</div><p><b>${esc(TASKS.transferLesen.prompt)}</b></p><div class="choice-grid">${TASKS.transferLesen.options.map((x,i)=>`<button class="choice ${S.ui.selected===i?'selected':''}" onclick="S.ui.selected=${i};save();render()">${esc(x)}</button>`).join('')}</div>${cta('Проверить transfer','submitTransfer()')}`;
  return `<span class="eyebrow">Repair завершён</span><h1 class="h2">Ошибка доведена до нового контекста</h1>${card('Что изменилось','Self-correction выполнен, transfer подтверждён, повторение поставлено на будущее.','good')}${cta('Продолжить сессию','continueAfterRepair()')}`;
}
function startSelfCorrection(){const e=S.errors.find(x=>x.id===S.daily.activeError);e.explained=true;save();render();}
function submitSelfCorrection(){const e=S.errors.find(x=>x.id===S.daily.activeError),t=TASKS[e.sourceTask];if(S.ui.selected==null)return alert('Выберите ответ.');const ok=S.ui.selected===t.correct;recordEvidence(t.module,t.skill,ok?'success':'failure','self_correction',{taskId:e.sourceTask,assisted:true});if(!ok){e.recurrence++;e.explained=false;e.selfCorrection=false;S.ui.selected=null;save();render();return;}e.selfCorrection=true;S.ui.selected=null;save();render();}
function submitTransfer(){const e=S.errors.find(x=>x.id===S.daily.activeError),t=TASKS.transferLesen;if(S.ui.selected==null)return alert('Выберите ответ.');const ok=S.ui.selected===t.correct;recordEvidence(t.module,t.skill,ok?'success':'failure','transfer',{taskId:'transferLesen',assisted:false});S.ui.selected=null;if(ok){e.transfer=true;e.status='resolved';e.nextDue=new Date(Date.now()+86400000).toISOString();S.reviews.push({id:uid('rev'),errorId:e.id,module:e.module,skill:e.skill,dueAt:e.nextDue,status:'scheduled'});}else{e.recurrence++;e.status='active';e.selfCorrection=false;e.explained=false;}recompute();save();render();}
function continueAfterRepair(){S.daily.step='hoeren';save();go('daily');}
function dailyHoeren(){return `${dailyHeader('Hören')}<h1 class="h2">Hören · Training</h1>${audioTask('trainHoeren','Изменение договорённости',`submitDailyHoeren()`,true)}`;}
function submitDailyHoeren(){if(S.ui.selected==null)return alert('Выберите ответ.');const t=TASKS.trainHoeren,ok=S.ui.selected===t.correct;recordEvidence('Hören',t.skill,ok?'success':'failure','training',{taskId:'trainHoeren',selected:S.ui.selected,audio:true,assisted:!!S.ui.strategy.trainHoeren});if(!ok)addError('trainHoeren',S.ui.selected);S.ui.selected=null;S.daily.step='writing';save();render();}
function dailyWriting(){return `${dailyHeader('Schreiben')}<h1 class="h2">Schreiben · Aufgabe 1 style</h1><div class="task-text"><b>Sie konnten gestern nicht zu einem Treffen mit einem Freund kommen.</b><ul><li>Entschuldigen Sie sich.</li><li>Erklären Sie, warum Sie nicht kommen konnten.</li><li>Schlagen Sie einen neuen Termin vor.</li></ul></div><textarea id="dailyWriting" class="field" rows="9" placeholder="Schreiben Sie auf Deutsch…"></textarea><div class="notice">Preview: после завершённого ответа работает deterministic structural check. В production здесь один consolidated AI review по rubric.</div>${cta('Получить feedback','submitDailyWriting()')}`;}
function submitDailyWriting(){const text=$('#dailyWriting').value.trim(),a=analyzeWriting(text);if(!a.valid)return alert('Для превью нужен осмысленный немецкий текст от ~20 слов.');S.daily.writingFeedback=a;recordEvidence('Schreiben','task_fulfilment',a.covered===3?'success':'failure','training',{taskId:'dailyWriting',wordCount:a.words,functions:a.funcs});S.daily.step='writing-feedback';save();go('writing-feedback');}
function writingFeedback(){const a=S.daily.writingFeedback||{words:0,covered:0,funcs:{}};return `<span class="eyebrow">Schreiben · feedback</span><h1 class="h2">Что проверено в Preview</h1><div class="grid2">${card('Выполнение задачи',`${a.covered}/3 коммуникативных функций найдены. ${a.covered===3?'Все пункты обнаружены.':'Есть незакрытый пункт.'}`,a.covered===3?'good':'warn')}${card('Объём',`${a.words} слов. Это только технический сигнал пригодности образца, не Goethe score.`,'soft')}</div>${card('Что будет делать AI позже','Task fulfilment → coherence/structure → vocabulary → grammatical structures → key errors → short explanations → next targets. Один завершённый ответ = один structured call.','soft')}<div class="button-row">${cta('Исправить самому','renderWritingRevision()','secondary')}${cta('Перейти к Sprechen','toSpeaking()')}</div>`;}
function renderWritingRevision(){alert('В этом Preview 1 ветка самостоятельного редактирования обозначена как следующий слой. Сейчас проверяем end-to-end навигацию и product logic.');}
function toSpeaking(){S.daily.step='speaking';save();go('daily');}
function dailySpeaking(){visit('speaking');return `${dailyHeader('Sprechen')}<h1 class="h2">Otto — партнёр, а не интервьюер</h1><p class="lead">Aufgabe 1 style: вместе спланируйте маленькую встречу учебной группы. Вы можете говорить вслух и при желании записывать попытку; в Preview смысл не распознаётся автоматически.</p>${speakingTurnView()}`;}
const SPEAK_TURNS=[
  {otto:'Wir wollen am Samstag ein kleines Treffen für unsere Lerngruppe organisieren. Ich würde 16 Uhr vorschlagen. Was meinst du?',choices:[['Согласиться и добавить деталь','Отлично. Тогда давай решим, где встречаемся.'],['Не согласиться и объяснить','Хорошо, найдём компромисс. Какое время тебе подходит?'],['Уточнить','Конечно. Я имею в виду субботу после обеда.']]},
  {otto:'Ich finde den Park am Bahnhof gut, weil man ihn leicht erreichen kann. Passt das für dich?',choices:[['Предложить альтернативу','Тогда можем встретиться в кафе рядом с парком.'],['Согласиться и двинуть план дальше','Хорошо. Я напишу остальным участникам.'],['Попросить уточнение','Нужно выбрать точное место у входа.']]},
  {otto:'Wer kauft dann die Getränke und wer informiert die Gruppe?',choices:[['Взять одну задачу и предложить вторую Otto','Договорились. Значит, у нас есть время, место и задачи.'],['Предложить разделить задачи','Согласен. Так план получается конкретным.']]}
];
function speakingTurnView(){const t=SPEAK_TURNS[Math.min(S.speaking.turn,SPEAK_TURNS.length-1)];return `<div class="stack">${S.speaking.history.map(x=>`<div class="bubble" style="${x.who==='user'?'margin-left:15%;background:#0f335b;color:white;border-radius:18px 18px 4px 18px':''}"><b>${x.who==='otto'?'Otto':'Вы'}:</b> ${esc(x.text)}</div>`).join('')}<div class="bubble"><b>Otto:</b> ${esc(t.otto)}</div></div><div class="record-box" style="margin-top:14px"><span class="record-dot"></span><span>${S.speaking.recordings?'Есть аудио-попытка':'Запись не обязательна для просмотра логики Preview'}</span><div class="button-row" style="justify-content:center"><button class="btn ghost" onclick="toggleRecording('speaking')">🎙 Записать ответ</button></div></div><p class="small">После того как вы сказали ответ вслух, отметьте коммуникативное действие, которое использовали:</p><div class="choice-grid">${t.choices.map((c,i)=>`<button class="choice" onclick="speakingChoice(${i})">${esc(c[0])}</button>`).join('')}</div>`;}
function speakingChoice(i){const t=SPEAK_TURNS[Math.min(S.speaking.turn,SPEAK_TURNS.length-1)],c=t.choices[i];S.speaking.history.push({who:'user',text:c[0]},{who:'otto',text:c[1]});recordEvidence('Sprechen','interaction','success','guided',{taskId:'speakingPair',audio:S.speaking.recordings>0,assisted:true});S.speaking.turn++;if(S.speaking.turn>=SPEAK_TURNS.length){S.daily.step='summary';save();go('daily');}else{save();render();}}
function dailySummary(){return `<span class="eyebrow">Сессия завершена</span><h1 class="h2">Что реально произошло</h1><div class="grid2">${card('Evidence',`${S.evidence.filter(e=>e.mode==='training'||e.mode==='transfer').length} новых учебных событий. Не все равны independent mastery.`,'soft')}${card('Ошибки',`${S.errors.length} зафиксировано; ${S.errors.filter(e=>e.status==='resolved').length} уже прошло transfer.`,'soft')}</div>${S.reviews.length?card('Future review',`После исправления создано ${S.reviews.length} отложенное повторение. В Preview дата хранится в браузере.`,'good'):card('Future review','Если в Lesen сделать ошибку, после self-correction и transfer появится due-review.','warn')}<div class="button-row">${cta('Посмотреть прогресс','go(\'progress\')')}${cta('Weekly checkpoint','startWeekly()','secondary')}</div>`;}

function errors(){const es=S.errors.slice().reverse();return `<span class="eyebrow">Мои ошибки</span><h1 class="h2">История ошибок — не кладбище красных крестиков</h1><p class="lead">Здесь видно, дошла ли ошибка до самостоятельного исправления, нового контекста и будущего повторения.</p><div class="stack">${es.length?es.map(e=>`<div class="card ${e.status==='resolved'?'good':'bad'}"><div class="status-row"><div><b>${esc(e.module)} · ${esc(skillLabel(e.skill))}</b><p class="muted">${esc(e.reason||'Нужно перепроверить смысл.')}</p><p class="small">Возвратов: ${e.recurrence} · self-correction: ${e.selfCorrection?'да':'нет'} · transfer: ${e.transfer?'да':'нет'}</p></div>${pill(e.status==='resolved'?'transfer подтверждён':'активна',e.status==='resolved'?'good':'bad')}</div></div>`).join(''):card('Пока пусто','Чтобы проверить этот раздел, в ежедневном Lesen выберите неверный ответ и пройдите repair.','soft')}</div>${es.length?`<div class="button-row">${cta('Отработать активную ошибку','practiceError()')}</div>`:''}`;}
function practiceError(){const e=S.errors.find(x=>x.status!=='resolved'&&x.module==='Lesen');if(!e)return alert('В этом вертикальном Preview полный repair-flow реализован для Lesen. Ошибки других модулей уже попадают в историю и маршрут, а их отдельные repair-сценарии добавляются после owner review.');S.daily.activeError=e.id;go('repair');}
function progress(){const total=S.evidence.length;return `<span class="eyebrow">Прогресс</span><h1 class="h2">Evidence и устойчивость, а не счётчик кликов</h1><div class="grid4">${MODULES.map(m=>{const x=moduleSummary(m),count=S.evidence.filter(e=>e.module===m).length;return `<div class="module-card"><b>${m}</b>${pill(x.label,x.kind)}<p class="small">Evidence events: ${count}</p><div class="evidence-bar">${[0,1,2,3].map(i=>`<span class="${count>i?'on':''}"></span>`).join('')}</div></div>`}).join('')}</div>${card('Readiness','Ни один общий процент не показывается. Пока данных мало, интерфейс говорит «недостаточно данных / нужно подтверждение».','warn')}<div class="grid2" style="margin-top:14px">${card('Всего evidence',`<span class="summary-stat">${total}</span>`,'soft')}${card('Отложенных review',`<span class="summary-stat">${S.reviews.filter(r=>r.status!=='done').length}</span>`,'soft')}</div><div class="button-row">${cta('Weekly checkpoint','startWeekly()','secondary')}${cta('Exam-mode proof','startExam()','ghost')}</div>`;}

function startWeekly(){visit('weekly');S.weekly={answers:[],completed:false};S.ui.selected=null;save();go('weekly');}
function weekly(){visit('weekly');const i=S.weekly.answers.length;if(i>=2){S.weekly.completed=true;recompute();save();return `<span class="eyebrow">Weekly checkpoint</span><h1 class="h2">Маршрут пересчитан</h1>${card('Что изменилось','Новые независимые ответы добавлены в evidence. Слабые/неподтверждённые навыки снова ранжированы.','good')}<div class="stack">${S.priorities.slice(0,3).map((x,n)=>routeItem(x,n)).join('')}</div><div class="button-row">${cta('К маршруту','go(\'route\')')}${cta('Exam-mode proof','startExam()','secondary')}</div>`;}
  const id=i===0?'checkpointLesen':'checkpointHoeren';const t=TASKS[id];return `<span class="eyebrow">Weekly checkpoint · ${i+1}/2</span><h1 class="h2">Без подсказок и перевода</h1><div class="notice">Знакомые вопросы не повторяются. Это независимый срез, а не тренировочный экран.</div>${t.audioText?`<button class="btn secondary" onclick="playTaskAudio('${id}')">▶ Воспроизвести аудио</button>`:`<div class="task-text">${esc(t.text)}</div>`}<p><b>${esc(t.prompt)}</b></p><div class="choice-grid">${t.options.map((x,n)=>`<button class="choice ${S.ui.selected===n?'selected':''}" onclick="S.ui.selected=${n};save();render()">${esc(x)}</button>`).join('')}</div>${cta(i===0?'Дальше':'Завершить checkpoint',`submitWeekly('${id}')`)}`;}
function submitWeekly(id){if(S.ui.selected==null)return alert('Выберите ответ.');const t=TASKS[id],ok=S.ui.selected===t.correct;S.weekly.answers.push({id,ok});recordEvidence(t.module,t.skill,ok?'success':'failure','weekly',{taskId:id,audio:!!t.audioText,assisted:false});if(!ok)addError(id,S.ui.selected);S.ui.selected=null;save();render();}

function startExam(){visit('exam');S.exam={index:0,answers:[],startedAt:Date.now(),endsAt:Date.now()+4*60*1000,completed:false,audioPlays:{}};S.ui.selected=null;save();go('exam');}
function exam(){visit('exam');if(S.exam.completed)return examResult();if(Date.now()>=S.exam.endsAt){S.exam.completed=true;save();return examResult();}const ids=['examLesen','examHoeren'],id=ids[S.exam.index],t=TASKS[id];return `<span class="eyebrow">Exam-mode proof · ${S.exam.index+1}/${ids.length}</span><div class="status-row"><div><h1 class="h2">Без hints, перевода и immediate feedback</h1><p class="muted">Это proof-of-concept, не полный пробный экзамен.</p></div><div id="examTimer" class="timer">${formatTime(S.exam.endsAt-Date.now())}</div></div><div class="divider"></div>${t.audioText?`<button class="btn secondary" onclick="playTaskAudio('${id}')">▶ Аудио${S.exam.audioPlays[id]?` · ${S.exam.audioPlays[id]}`:''}</button>`:`<div class="task-text">${esc(t.text)}</div>`}<p class="lead" style="font-size:17px"><b>${esc(t.prompt)}</b></p><div class="choice-grid">${t.options.map((x,n)=>`<button class="choice ${S.ui.selected===n?'selected':''}" onclick="S.ui.selected=${n};save();render()">${esc(x)}</button>`).join('')}</div>${cta(S.exam.index===ids.length-1?'Завершить блок':'Следующее','submitExam()')}`;}
function submitExam(){if(S.ui.selected==null)return alert('Выберите ответ.');const ids=['examLesen','examHoeren'],id=ids[S.exam.index],t=TASKS[id],ok=S.ui.selected===t.correct;S.exam.answers.push({id,module:t.module,ok});recordEvidence(t.module,t.skill,ok?'success':'failure','exam_like',{taskId:id,audio:!!t.audioText,assisted:false});if(!ok)addError(id,S.ui.selected);S.ui.selected=null;S.exam.index++;if(S.exam.index>=ids.length)S.exam.completed=true;save();render();}
function examResult(){const ok=S.exam.answers.filter(a=>a.ok).length,total=S.exam.answers.length;return `<span class="eyebrow">Exam-mode proof · результат после блока</span><h1 class="h2">${ok}/${total} в этом коротком proof</h1><p class="lead">Этот результат не называется Goethe score и не считается полноценным mock. В полном продукте mock будет соответствовать полной структуре и времени соответствующих модулей.</p><div class="stack">${S.exam.answers.map(a=>card(`${a.module} · ${a.ok?'верно':'ошибка'}`,a.ok?'Новый риск не найден.':'Риск возвращён в персональный маршрут.',a.ok?'good':'bad')).join('')}</div><div class="button-row">${cta('Вернуться в маршрут','go(\'route\')')}${cta('Открыть Otto Personal','openOtto()','secondary')}</div>`;}
function formatTime(ms){const s=Math.max(0,Math.ceil(ms/1000));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
function startExamTicker(){stopExamTicker();examTimer=setInterval(()=>{const el=$('#examTimer');if(!el)return;const ms=S.exam.endsAt-Date.now();el.textContent=formatTime(ms);if(ms<=0){clearInterval(examTimer);S.exam.completed=true;save();render();}},1000)}
function stopExamTicker(){if(examTimer){clearInterval(examTimer);examTimer=null;}}

function home(){recompute();const p=S.priorities[0];return `<span class="eyebrow">${esc(S.name||'Otto B1')}</span><h1 class="h2">Что мне делать сегодня?</h1><p class="lead">Один главный CTA. Otto сам выбирает ближайший полезный шаг из вашего профиля.</p>${p?card('Главный приоритет',`<b>${esc(p.module)} · ${esc(p.label)}</b><br>${esc(p.reason)}`,'soft'):card('Сначала диагностика','Профиль ещё не создан.','warn')}<div class="button-row">${cta(S.diagnostic.completed?'Продолжить мою подготовку':'Пройти диагностику',S.diagnostic.completed?'startDaily()':'go(\'diagnostic\')')}</div><div class="grid4" style="margin-top:24px">${MODULES.map(m=>{const x=moduleSummary(m);return `<button class="module-card" style="text-align:left;cursor:pointer" onclick="moduleInfo('${m}')"><b>${m}</b>${pill(x.label,x.kind)}</button>`}).join('')}</div>`;}
function moduleInfo(m){alert(`${m}: в Preview свободный вход показывает состояние evidence. Полный банк заданий появится после owner review вертикального среза.`);}

function openScenario(){S.ui.scenarioOpen=true;save();renderModal();}
function closeScenario(){S.ui.scenarioOpen=false;save();renderModal();}
function renderModal(){const root=$('#modalRoot');if(S.ui.scenarioOpen){root.innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="modal-head"><div><span class="eyebrow">Owner walkthrough</span><h2 style="margin:0">Сценарий проверки Preview 1</h2></div><button class="close" onclick="closeScenario()">×</button></div><p class="muted">Проходите сверху вниз. Для ветки repair в ежедневном Lesen намеренно выберите неверный ответ.</p><div class="checklist">${CHECKS.map(([k,label])=>`<div class="check-item ${S.visited.includes(k)?'done':''}"><span class="check-dot">${S.visited.includes(k)?'✓':'•'}</span><div><b>${esc(label)}</b><div class="small">${scenarioHint(k)}</div></div></div>`).join('')}</div></div></div>`;return;}if(S.ui.ottoOpen){root.innerHTML=ottoModal();return;}root.innerHTML='';}
function scenarioHint(k){return ({onboarding:'Проверить спокойный визуал и стартовый CTA.',diagnostic:'Пройти baseline + 4 модуля; записать речь или пропустить.',report:'Убедиться, что нет псевдопроцента.',route:'Посмотреть «почему сейчас».',daily:'Пройти representative flows всех 4 модулей.',repair:'В Lesen сделать ошибку → исправить → transfer.',speaking:'Проверить, что Otto предлагает/возражает/уточняет.',weekly:'Новый независимый срез без hints.',exam:'В exam нет перевода/стратегии и feedback до конца.',otto:'Открыть плавающую кнопку Otto.'}[k]||'');}
function openOtto(){visit('otto');S.ui.ottoOpen=true;save();renderModal();}
function closeOtto(){S.ui.ottoOpen=false;save();renderModal();}
function ottoModal(){return `<div class="modal-backdrop"><div class="modal"><div class="modal-head"><div><span class="eyebrow">Otto Personal · shell</span><h2 style="margin:0">Проверить с Otto</h2></div><button class="close" onclick="closeOtto()">×</button></div><div class="speaker"><div class="speaker-avatar"><img src="${OTTO_SRC}" alt="Otto"></div><div class="muted">В Preview онлайн-AI не подключён. Здесь проверяем место функции в продукте и будущий context boundary.</div></div><textarea id="ottoQuestion" class="field" rows="5" placeholder="Например: проверь это письмо, объясни ошибку, что делать в Hören Teil 1…"></textarea><label class="card" style="display:block;margin-top:12px"><b>Внешний материал</b><input type="file" class="field" style="margin-top:8px"></label><div class="button-row"><button class="btn primary" onclick="ottoPreviewReply()">Показать, как Otto обработает запрос</button></div><div id="ottoReply"></div></div></div>`;}
function ottoPreviewReply(){const q=$('#ottoQuestion').value.trim();const box=$('#ottoReply');if(!q)return alert('Введите вопрос или описание материала.');let type=/schreib|письм|email|текст/i.test(q)?'Schreiben':/sprech|произнош|голос/i.test(q)?'Sprechen':/hör|аудио/i.test(q)?'Hören':/les|чтен|текст/i.test(q)?'Lesen':'Goethe B1 general';box.innerHTML=`<div class="card soft" style="margin-top:14px"><b>Preview classification: ${type}</b><p class="muted">В production Otto возьмёт только текущий запрос, релевантную rubric/task family и несколько нужных targets из профиля — без отправки всей истории пользователя.</p></div>`;}

const VIEWS={welcome,setup,diagnostic,report,route,home,daily,repair,'writing-feedback':writingFeedback,errors,progress,weekly,exam};
window.S=S;window.go=go;window.save=save;window.render=render;window.reset=reset;window.openScenario=openScenario;window.closeScenario=closeScenario;window.openOtto=openOtto;window.closeOtto=closeOtto;
window.saveSetup=saveSetup;window.diagAnswer=diagAnswer;window.toggleTranslation=toggleTranslation;window.toggleStrategy=toggleStrategy;window.playTaskAudio=playTaskAudio;window.saveDiagnosticWriting=saveDiagnosticWriting;window.toggleRecording=toggleRecording;window.finishSpeakingDiagnostic=finishSpeakingDiagnostic;window.skipSpeakingDiagnostic=skipSpeakingDiagnostic;window.startDaily=startDaily;window.submitDailyLesen=submitDailyLesen;window.startSelfCorrection=startSelfCorrection;window.submitSelfCorrection=submitSelfCorrection;window.submitTransfer=submitTransfer;window.continueAfterRepair=continueAfterRepair;window.submitDailyHoeren=submitDailyHoeren;window.submitDailyWriting=submitDailyWriting;window.renderWritingRevision=renderWritingRevision;window.toSpeaking=toSpeaking;window.speakingChoice=speakingChoice;window.practiceError=practiceError;window.startWeekly=startWeekly;window.submitWeekly=submitWeekly;window.startExam=startExam;window.submitExam=submitExam;window.moduleInfo=moduleInfo;window.ottoPreviewReply=ottoPreviewReply;

document.addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b)go(b.dataset.nav);});
$('#scenarioButton').addEventListener('click',openScenario);
$('#resetButton').addEventListener('click',()=>{if(confirm('Сбросить все данные этого Preview и начать сначала?'))reset();});
$('#ottoFab').addEventListener('click',openOtto);
window.addEventListener('hashchange',render);
window.addEventListener('beforeunload',stopExamTicker);

if(!location.hash)location.hash='#welcome';
const fabImg=document.getElementById('ottoFabImg');if(fabImg)fabImg.src=OTTO_SRC;
recompute();render();renderModal();

</script>
