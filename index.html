<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OTTO B1</title><style>body{font-family:system-ui;margin:0;display:grid;place-items:center;min-height:100vh;background:#f3eee7;color:#3b3028}.box{text-align:center;padding:24px}pre{white-space:pre-wrap}</style></head><body><div class="box"><h2>OTTO B1</h2><p>Загрузка приложения…</p></div><script>(async()=>{try{const files=['app/part-01.txt','app/part-02.txt','app/part-03.txt','app/part-04.txt','app/part-05.txt'];const text=(await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})))).join('');document.open();document.write(text);document.close()}catch(e){document.body.innerHTML='<div class="box"><h2>Не удалось загрузить OTTO B1</h2><pre>'+String(e)+'</pre></div>'}})();</script></body></html>
